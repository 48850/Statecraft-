      ${confRow()}
      <p class="hint">Type first and your answer gets marked, with a suggested rating. Keys 1 to 5 rate. Low ratings bring the card back sooner.</p></section>`;
    wireBack(); $('#ty').focus({preventScroll:true});
    const btns = [...app.querySelectorAll('.cbtn')]; btns.forEach(x => x.disabled = true);
    const reveal = () => { if (on) return; on = true; const typed = $('#ty').value.trim();
      $('#fc').classList.add('on'); btns.forEach(x => x.disabled = false); $('#rev').disabled = true; $('#ty').disabled = true;
      if (typed){ const my = gen, c0 = cur; $('#ans').style.display = 'none'; $('#vd').innerHTML = thinkingHTML();
        judge(c0, typed).then(j => { if (my !== gen) return; $('#vd').innerHTML = judgeHTML(c0, j); blip(j.verdict === 'incorrect' ? 'bad' : 'good');
          const sg = suggestConf(j.score); btns.forEach(x => x.classList.toggle('sug', +x.dataset.r === sg)); }); } };
    $('#rev').onclick = reveal; $('#fc').onclick = reveal;
    $('#ty').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); reveal(); } };
    const rate = r => { if (!on) return; setConf(cur.id, r); done++; gain(2 + r); blip(r >= 4 ? 'good' : r <= 2 ? 'bad' : 'good');
      if (r < 5){ const at = r === 1 ? 2 : r === 2 ? 4 : r === 3 ? 8 : queue.length; queue.splice(Math.min(queue.length, at), 0, cur); }
      draw(); };
    btns.forEach(x => x.onclick = () => rate(+x.dataset.r));
    onKeys(e => { if (!on || e.target.tagName === 'TEXTAREA') return; const k = +e.key; if (k >= 1 && k <= 5) rate(k); });
  }
  draw();
}

/* ---------- 07 exam questions (VCAA command terms) ---------- */
S.exam = S.exam || {};
const examPool = () => [...sel].flatMap(d => (DECKS[d].exam || []).map((e, k) => ({d, k, id: d + ':x' + k, t: e.t, m: e.m, q: e.q, g: e.g})));
const mins = m => Math.max(2, Math.round(m * 1.5));
function termBox(t){
  const i = window.VCAA && VCAA.info(t), name = window.VCAA ? VCAA.canon(t) : t;
  return i ? `<details class="termdef"><summary><b>${esc(t)}</b>: what VCAA wants</summary><p><b>VCAA definition${name !== t ? ' (' + esc(name) + ')' : ''}:</b> ${esc(i.def)}</p><p><b>So you must:</b> ${esc(i.need)}</p></details>` : '';
}
function examOffline(ex, typed){
  // Split the marking guide into its points and check which ones the answer covers.
  const tc = window.VCAA ? VCAA.meets(ex.t, typed) : {met:true, miss:''};
  const pts = ex.g.split(/;|\.\s+|:\s+(?=[A-Z(])/).map(x => x.replace(/^[\s]*(and |or )?/, '').replace(/[\s.]+$/, '').trim())
    .map(x => { const o = (x.match(/\(/g) || []).length, c = (x.match(/\)/g) || []).length; return o > c ? x + ')' : c > o ? x.replace(/^\)?\s*/, '').replace(/\)$/, '') : x; })
    .filter(x => x.length > 12 && !/^(must|include|use|show|link|make|reach|weigh|state|give|name|accurate|an? (overall |clear |balanced )?(judgement|introduction|conclusion)|one mark|1 mark|2 marks|significance of)/i.test(x));
  const hit = pts.filter(x => grade(x, typed).score >= .34), miss = pts.filter(x => !hit.includes(x));
  const words = (typed.match(/\S+/g) || []).length, need = ex.m * 12;
  let mark = Math.round((pts.length ? hit.length / pts.length : 0) * ex.m * Math.min(1, words / need));
  if (!tc.met) mark = Math.min(mark, Math.floor(ex.m / 2));
  const short = x => x.length > 90 ? x.slice(0, 88).trimEnd() + '…' : x;
  return {mark, marks: ex.m, term_met: tc.met, term_feedback: tc.met ? 'Your answer shows the moves "' + ex.t + '" needs. Check each point is developed, not just stated.' : tc.miss,
    right: hit.length ? 'You touched on ' + hit.length + ' of ' + pts.length + ' points in the marking guide.' : '',
    improve: words < need ? `Too short for ${ex.m} marks: aim for about ${need}+ words with one developed point per mark.` : miss.length ? 'Cover this next: ' + short(miss[0]) + '.' : 'Develop each point with specific evidence (dates, names, figures).',
    missing: miss.slice(0, 4).map(short), model: '', ai: false};
}
async function examJudge(ex, typed){
  if (!typed.trim()) return {mark:0, marks:ex.m, term_met:false, term_feedback:'Nothing written.', right:'', improve:'Have a go: a rough plan of three points beats a blank page.', missing:[], model:'', ai:false};
  if (aiReady() && SAMPLE.examCard){
    try {
      const r = await SAMPLE.examCard(ex, typed);
      const mark = Math.max(0, Math.min(ex.m, Math.round(Number(r && r.mark) || 0)));
      return {mark: r && r.term_met === false ? Math.min(mark, Math.floor(ex.m / 2)) : mark, marks: ex.m, term_met: !(r && r.term_met === false),
        term_feedback: String((r && r.term_feedback) || '').slice(0, 400), right: String((r && r.right) || '').slice(0, 400), improve: String((r && r.improve) || '').slice(0, 400),
        missing: Array.isArray(r && r.missing) ? r.missing.slice(0, 4).map(x => String(x).slice(0, 160)) : [], model: String((r && r.model) || '').slice(0, 2500), ai: true};
    } catch(e){ aiNote = (e && e.code) === 'rate_limited' ? 'The AI examiner is busy right now, so this was marked by keyword and command-term check.' : 'The AI examiner did not answer, so this was marked by keyword and command-term check.'; }
  }
  return examOffline(ex, typed);
}
function examHTML(ex, j){

    <p class="tmet ${j.term_met ? 'ok' : 'no'}"><small>Command term: ${esc(ex.t)} ${j.term_met ? 'met' : 'not met (capped at half marks)'}</small>${esc(j.term_feedback)}</p>
    <div class="fbk">${j.right ? `<p class="ok"><small>What earned marks</small>${esc(j.right)}</p>` : ''}${j.improve ? `<p class="fix"><small>To get the next mark</small>${esc(j.improve)}</p>` : ''}</div>
    ${j.missing.length ? `<div class="missing"><small>Missing</small>${j.missing.map(m => `<span>${esc(m)}</span>`).join('')}</div>` : ''}

function exam(){

  function ask(prefill=''){

      results(p >= 80 ? 'Top band' : p >= 50 ? 'Exam set done' : 'Keep drilling', got + ' / ' + out, p + '% of available marks across ' + qs.length + ' questions.', missed.map(e => ({q: e.t + ': ' + e.q, a: e.g})), exam); return; }

/* ---------- 06 recall (type it) ---------- */
function recall(list){
  clearTimers();
  const own = Array.isArray(list) && list.length;
  const qs = own ? shuffle([...list]) : shuffle(pool()).slice(0, 8);
  let n = 0, pts = 0, right = 0, missed = [];
  function ask(){
    if (n >= qs.length){ gain(15 + right*8); if (right >= Math.ceil(qs.length*.75)) confetti(); blip('win');
      const k = bestKey('recall'), isBest = !own && pts > (S.best[k]||0); if (isBest){ S.best[k] = pts; save(); }
      onKeys(null); results(right >= Math.ceil(qs.length*.75) ? 'Total recall' : 'Recall complete', pts + ' pts', right + ' / ' + qs.length + ' answered well' + (isBest ? ' · new best' : ''), missed, own ? () => recall(list) : recall); return; }
    const c = qs[n];
    app.innerHTML = `<section class="stage">${topBar(`<div><span>Q</span>${n+1}/${qs.length}</div><div><span>SCORE</span>${pts}</div>`)}
      <div class="prompt"><small>${esc(DECKS[c.d].name)} · type your answer</small>${termTag(TERM(c.q))}${esc(c.q)}</div>
      <div class="typebox"><textarea id="ty" rows="3" placeholder="Write the answer in your own words. Key terms, names, dates and numbers score points."></textarea><button type="button" class="btn gold" id="go">Submit</button></div>
      <div id="fb"></div></section>`;
    wireBack(); $('#ty').focus({preventScroll:true});
    let done = false;
    const submit = async () => { if (done) return; done = true; const my = gen;
      $('#ty').disabled = true; $('#go').disabled = true; $('#fb').innerHTML = thinkingHTML();
      const j = await judge(c, $('#ty').value); if (my !== gen) return; const p = j.score;
      const sg = suggestConf(j.score);
      $('#fb').innerHTML = judgeHTML(c, j, `${confRow(sg)}<div class="row ovrow"><button type="button" class="btn" id="ovr">The marking was wrong: I knew it</button></div>`);
      let got = passed(j); pts += p; if (!got) missed.push(c); else right++;
      blip(got ? 'good' : 'bad');
      $('#ovr').onclick = () => { if (!got){ got = true; right++; missed.pop(); pts += 50 - Math.min(50, p); $('#ovr').disabled = true; $('#ovr').textContent = 'Counted as right'; } };
      const next = r => { setConf(c.id, r); onKeys(null); n++; ask(); };
      app.querySelectorAll('.cbtn').forEach(x => x.onclick = () => next(+x.dataset.r));
      onKeys(e => { if (e.target.tagName === 'TEXTAREA' || e.repeat) return; const k = +e.key; if (k >= 1 && k <= 5) next(k); else if (e.key === 'Enter'){ e.preventDefault(); next(sg); } });
      app.querySelector('.cbtn.sug').focus({preventScroll:true}); };
    $('#go').onclick = submit;
    $('#ty').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(); } };
  }
  ask();
}

  const d = [...sel][Math.floor(Math.random()*sel.size)];
  const name = sel.size === 1 ? DECKS[d].boss : 'The Final Boss';
  const art = DECKS[d].art ?? d, sc = SCENES[art] || SCENES[0], [l,t,r,b] = sc.box;
  const plate = art !== d ? `<div class="plate" style="left:${sc.plate[0]}%;top:${sc.plate[1]}%;width:${sc.plate[2]}%;height:${sc.plate[3]}%">${esc(sel.size === 1 ? DECKS[d].name : S.subj)}</div>` : '';
  const deck = shuffle(pool());
  let hp = 100, hearts = 3, combo = 0, turn = 0, missed = [], locked = false, over = false;
  app.innerHTML = `<section class="stage">${topBar(`<div><span>COMBO</span><b class="combo" id="cb">0</b></div>`)}
    <div class="arena3" id="arena">
      <div class="hudrow">
        <div class="pl"><b>You</b><div class="hearts" id="hearts"></div></div>
        <div class="bs"><b>${esc(name)}</b><div class="hp"><i id="hp" style="width:100%"></i></div><small id="hpn">100 / 100 HP</small></div>
      </div>
      <div class="scene" id="scene" style="--img:url('media/boss-${art}.jpg');--cx:${sc.c[0]}%;--cy:${sc.c[1]}%;--tx:${sc.tip[0]}%;--ty:${sc.tip[1]}%">
        <div class="cam" id="cam">
          <div class="ly base"></div>
          <div class="ly bossl" id="mon" style="--mask:radial-gradient(ellipse ${(r-l)/2+4}% ${(b-t)/2+6}% at ${sc.c[0]}% ${sc.c[1]+6}%, #000 55%, transparent 100%);transform-origin:${sc.c[0]}% ${sc.c[1]}%"></div>
          <div class="ly herol" id="hero" style="--mask:${HERO_MASK}"></div>
          ${plate}
        </div>
        <div class="slash" id="slash"></div>
        <div class="orb2" id="orb"></div>
        <div class="burst" id="burst"></div>
        <div class="floats2" id="floats"></div>
        <div class="taunt2" id="taunt"></div>
        <div class="vig" id="vig"></div>
        <div class="stamp2" id="stamp"></div>
      </div>
    </div>
    <div id="qa"></div></section>`;
  wireBack();
  const scene = $('#scene'), cam = $('#cam'), hero = $('#hero'), mon = $('#mon'), orb = $('#orb');
  const paintHearts = () => { $('#hearts').innerHTML = '♥'.repeat(Math.max(0,hearts)) + '<span style="opacity:.18">' + '♥'.repeat(3 - Math.max(0,hearts)) + '</span>'; };
  paintHearts();
  const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  const float = (txt, cls) => { const f = document.createElement('div'); f.className = 'fl2 ' + cls; f.textContent = txt; $('#floats').appendChild(f); later(() => f.remove(), 1200); };
  const taunt = txt => { const el = $('#taunt'); el.textContent = txt; replay(el, 'say'); };
  const TAUNTS = ['Is that all you know?', 'Read your booklet!', 'Wrong! Again!', 'Your notes cannot save you.', 'Sovereignty is MINE!'];
  later(() => taunt(name + ' appears!'), 200);
  function playerHits(dmg, crit){
    replay(hero, 'strike'); replay($('#slash'), 'go');
    const s = scene.getBoundingClientRect();
    orb.style.setProperty('--dx', ((sc.c[0] - sc.tip[0]) / 100 * s.width) + 'px');
    orb.style.setProperty('--dy', ((sc.c[1] - sc.tip[1]) / 100 * s.height) + 'px');
    orb.className = 'orb2' + (crit ? ' big' : ''); void orb.offsetWidth; orb.classList.add('fly');
    later(() => {
      hp = Math.max(0, hp - dmg); $('#hp').style.width = hp + '%'; $('#hpn').textContent = hp + ' / 100 HP';
      replay(mon, 'hurt'); replay($('#burst'), 'pop'); if (crit) replay(cam, 'kick');
      float('−' + dmg, crit ? 'crit' : 'dmg'); if (crit) float('CRITICAL!', 'critx'); blip('hit');
    }, 380);
  }
  function bossHits(){
    replay(mon, 'lunge');
    later(() => { hearts--; paintHearts(); replay(hero, 'hurt'); replay(cam, 'quake'); replay($('#vig'), 'flash');
      float('−1 ♥', 'ouch'); blip('bad'); taunt(TAUNTS[Math.floor(Math.random()*TAUNTS.length)]); }, 300);
  }
  function checkEnd(){
    if (hp <= 0 && !over){ over = true; onKeys(null); mon.classList.add('dead'); replay($('#burst'), 'pop'); taunt('Nooooo…');
      later(() => { const st = $('#stamp'); st.textContent = 'DEFEATED'; st.classList.add('show'); }, 500);
      [...sel].forEach(x => S.bosses[x] = 1); save();
      later(() => { confetti(); blip('win'); gain(120); results(name + ' defeated', 'VICTORY', 'You won with ' + hearts + ' heart' + (hearts===1?'':'s') + ' left. +120 XP', missed, boss); }, 1800); return true; }
    if (hearts <= 0 && !over){ over = true; onKeys(null); scene.classList.add('lost'); hero.classList.add('down'); taunt('Too easy.');
      later(() => { const st = $('#stamp'); st.textContent = 'YOU FELL'; st.classList.add('show','bad'); }, 500);
      later(() => { gain(10); results(name + ' wins', 'DEFEAT', 'Study what you missed below, then challenge it again.', missed, boss); }, 1800); return true; }
    return false;
  }
  function ask(){
    if (checkEnd()) return;
    const card = deck[turn % deck.length], special = turn % 3 === 2; turn++; locked = false;
    if (special){
      onKeys(null);
      $('#qa').innerHTML = `<div class="prompt special"><small>Special attack · type the answer · big damage</small>${termTag(TERM(card.q))}${esc(card.q)}</div>
        <div class="typebox"><textarea id="ty" rows="2" placeholder="Type key terms, names, dates or numbers…"></textarea><button type="button" class="btn gold" id="go">Strike</button></div><div id="fb"></div>`;
      $('#ty').focus({preventScroll:true});
      const cast = async () => { if (locked) return; locked = true; const my = gen;
        $('#ty').disabled = true; $('#go').disabled = true; $('#fb').innerHTML = thinkingHTML(); taunt('Let the judge decide…');
        const j = await judge(card, $('#ty').value); if (my !== gen || over) return;
        $('#fb').innerHTML = judgeHTML(card, j);
        if (passed(j)){ const dmg = Math.min(50, 22 + Math.round(j.score*.25) + combo*3); combo++; $('#cb').textContent = combo; playerHits(dmg, true); }
        else { combo = 0; $('#cb').textContent = 0; missed.push(card); bossHits(); }
        later(ask, 3600); };
      $('#go').onclick = cast; $('#ty').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); cast(); } };
      return;
    }
    const q = makeQ(card);
    $('#qa').innerHTML = `<div class="prompt"><small>${esc(DECKS[card.d].name)} · attack</small>${esc(card.q)}</div>`;
    const box = renderOpts(q, (i, box) => {
      if (locked) return; locked = true;
      const btns = box.querySelectorAll('.opt'); btns[q.right].classList.add('right');
      if (i === q.right){ const dmg = Math.min(30, 12 + combo*4), crit = combo >= 2; combo++; $('#cb').textContent = combo; playerHits(dmg, crit); }
      else { btns[i].classList.add('wrong'); combo = 0; $('#cb').textContent = 0; missed.push(card); bossHits(); }
      later(ask, i === q.right ? 1100 : 1900);
    });
    $('#qa').appendChild(box);
    onKeys(e => { const k = +e.key; if (k >= 1 && k <= 4 && box.isConnected && !locked) box.querySelectorAll('.opt')[k-1].click(); });
  }
  later(ask, 900);
}

/* ---------- 02 blitz ---------- */
function blitz(){
  clearTimers();
  const qs = shuffle(pool()).slice(0, 10).map(makeQ);
  let n = 0, score = 0, combo = 0, correct = 0, missed = [], locked = false;
  function ask(){
    if (n >= qs.length){ const k = bestKey('blitz'), isBest = score > (S.best[k]||0); if (isBest){ S.best[k] = score; save(); }
      gain(20 + correct*4); if (correct >= 8) confetti(); blip('win');
      results(correct >= 8 ? 'Blitzed it' : 'Blitz over', score + ' pts', correct + ' / 10 correct' + (isBest ? ' · new best' : ''), missed, blitz); return; }
    const q = qs[n]; locked = false; let t = 15;
    app.innerHTML = `<section class="stage">${topBar(`<div><span>Q</span>${n+1}/10</div><div><span>SCORE</span><b id="sc">${score}</b></div><div><span>COMBO</span><b class="combo" id="cb">x${(1+combo*.5).toFixed(1)}</b></div>`)}
      <div class="timer"><i id="tm" style="width:100%"></i></div>
      <div class="prompt"><small>${esc(DECKS[q.card.d].name)}</small>${esc(q.card.q)}</div></section>`;
    wireBack();
    const box = renderOpts(q, pick); app.querySelector('.stage').appendChild(box);
    const iv = setInterval(() => { t -= .1; $('#tm').style.width = Math.max(0, t/15*100) + '%'; if (t <= 0){ clearInterval(iv); pick(-1, box); } }, 100); timers.push(iv);
    function pick(i, box){
      if (locked) return; locked = true; clearInterval(iv);
      const btns = box.querySelectorAll('.opt'); btns[q.right].classList.add('right');
      if (i === q.right){ const pts = Math.round((100 + t*10) * (1 + combo*.5)); score += pts; combo++; correct++; blip('good'); $('#cb').classList.add('pop'); }
      else { if (i >= 0) btns[i].classList.add('wrong'); combo = 0; missed.push(q.card); blip('bad'); box.classList.add('shake'); }
      timers.push(setTimeout(() => { n++; ask(); }, i === q.right ? 650 : 1500));
    }
    onKeys(e => { const k = +e.key; if (k >= 1 && k <= 4) pick(k-1, box); });
  }
  ask();
}

/* ---------- 03 match ---------- */
function match(){
  clearTimers();
  const set = shuffle(pool()).slice(0, 6);
  const cut = (t, n) => t.length > n ? t.slice(0, n-1).trimEnd() + '…' : t;
  const tiles = shuffle(set.flatMap((c,k) => [{k, side:'q', t:c.q}, {k, side:'a', t:cut(c.a, 120)}]));
  let first = null, left = 6, t0 = performance.now(), pen = 0, misses = 0;
  app.innerHTML = `<section class="stage">${topBar(`<div><span>TIME</span><b id="clk">0.0s</b></div><div><span>PAIRS LEFT</span><b id="pl">6</b></div>`)}
    <div class="grid" id="grid">${tiles.map((x,i) => `<button type="button" class="tile ${x.side}" data-i="${i}"><i>${x.side==='q' ? 'QUESTION' : 'ANSWER'}</i>${esc(x.t)}</button>`).join('')}</div>
    <p class="hint">Tap a question, then its answer (or the other way round)</p></section>`;
  wireBack();
  const iv = setInterval(() => { $('#clk').textContent = ((performance.now()-t0)/1000 + pen).toFixed(1) + 's'; }, 100); timers.push(iv);
  app.querySelectorAll('.tile').forEach(el => el.onclick = () => {
    const x = tiles[+el.dataset.i];
    if (!first){ first = {el, x}; el.classList.add('sel'); return; }
    if (first.el === el){ el.classList.remove('sel'); first = null; return; }
    if (first.x.side === x.side){ first.el.classList.remove('sel'); first = {el, x}; el.classList.add('sel'); return; }
    if (first.x.k === x.k && first.x.side !== x.side){
      [first.el, el].forEach(e => { e.classList.remove('sel'); e.classList.add('gone'); }); blip('good'); left--; $('#pl').textContent = left;
      S.known[set[x.k].id] = S.known[set[x.k].id] || 0; first = null;
      if (!left){ clearInterval(iv); const secs = (performance.now()-t0)/1000 + pen, k = bestKey('match'), isBest = !S.best[k] || secs < S.best[k];
        if (isBest){ S.best[k] = secs; save(); } gain(30 + Math.max(0, 60 - secs)); confetti(); blip('win');
        timers.push(setTimeout(() => results('Matched!', secs.toFixed(1) + 's', misses + ' wrong pairs' + (isBest ? ' · new best time' : ''), [], match), 500)); }
    } else {
      pen += 3; misses++; blip('bad'); [first.el, el].forEach(e => { e.classList.add('no','shake'); setTimeout(() => e.classList.remove('no','shake','sel'), 400); }); first = null;
    }
  });
}

/* ---------- 05 true / false ---------- */
function tf(){
  clearTimers();
  let t = 60, score = 0, streak = 0, missed = [], cur = null, truth = true;
  const all = pool();
  app.innerHTML = `<section class="stage">${topBar(`<div><span>TIME</span><b id="clk">60</b></div><div><span>CORRECT</span><b id="sc">0</b></div><div><span>STREAK</span><b class="combo" id="st">0</b></div>`)}
    <div class="timer"><i id="tm" style="width:100%"></i></div>
    <div class="tf" id="card"><div class="q" id="q"></div><div class="a" id="a"></div></div>
    <div class="tfrow"><button type="button" class="btn good" id="T">True (←)</button><button type="button" class="btn bad" id="F">False (→)</button></div></section>`;
  wireBack();
  function next(){
    cur = all[Math.floor(Math.random()*all.length)]; truth = Math.random() < .5;
    let shown = cur.a;
    if (!truth){ const dc = DECKS[cur.d].cards; let j; do { j = Math.floor(Math.random()*dc.length); } while (j === cur.i); shown = dc[j][1]; }
    $('#q').textContent = cur.q; $('#a').textContent = shown;
  }
  function call(v){
    if (t <= 0) return;
    if (v === truth){ score++; streak++; blip('good'); $('#sc').textContent = score; $('#st').textContent = streak; $('#st').classList.remove('pop'); void $('#st').offsetWidth; $('#st').classList.add('pop'); }
    else { streak = 0; t -= 3; blip('bad'); missed.push(cur); $('#st').textContent = 0; $('#card').classList.remove('shake'); void $('#card').offsetWidth; $('#card').classList.add('shake'); }
    next();
  }
  $('#T').onclick = () => call(true); $('#F').onclick = () => call(false);
  onKeys(e => { if (e.key === 'ArrowLeft') call(true); if (e.key === 'ArrowRight') call(false); });
  const iv = setInterval(() => { t -= .1; $('#clk').textContent = Math.max(0, Math.ceil(t)); $('#tm').style.width = Math.max(0, t/60*100) + '%';
    if (t <= 0){ clearInterval(iv); const k = bestKey('tf'), isBest = score > (S.best[k]||0); if (isBest){ S.best[k] = score; save(); }
      gain(score*3); if (isBest && score > 5) confetti(); blip('win');
      const seen = new Set(); results("Time's up", score + ' correct', isBest ? 'New best!' : 'Best: ' + (S.best[k]||0), missed.filter(c => !seen.has(c.id) && seen.add(c.id)), tf); } }, 100);
  timers.push(iv); next();
}

$('#logo').onclick = home; $('#logo').onkeydown = e => { if (e.key === 'Enter') home(); };
paintBar(); home();
</script>
