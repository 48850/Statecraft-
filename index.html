<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Statecraft: a revision game for Global Politics, History and Geography, marked with the VCAA command terms. By Elliot Thevathasan.">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Statecraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: an arcade for revision. Sticky player bar (level, XP, streak) on top; a home screen of deck chips + mode cards; each mode is a full-width stage. One committed night look. */
:root{
  color-scheme:dark;
  --bg:#0e0f1f; --panel:#171933; --panel-2:#20234a; --line:#2e3263;
  --ink:#eef0ff; --ink-2:#aab0dc; --ink-3:#7479a8;
  --gold:#ffd23f; --good:#3ddc97; --bad:#ff5d73; --xp:#8b7bff; --hot:#ff8a3d;
  --f-display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.45;min-height:100vh;
  background-image:radial-gradient(circle at 15% -10%,rgba(139,123,255,.18),transparent 45%),radial-gradient(circle at 110% 20%,rgba(255,210,63,.08),transparent 40%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
/* player bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(14,15,31,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em;cursor:pointer}
.logo b{color:var(--gold)}
.lvl{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:0}
.badge{font-family:var(--f-display);font-weight:800;background:var(--xp);color:#fff;border-radius:10px;padding:3px 10px;font-size:14px;white-space:nowrap}
.xpbar{flex:1;height:10px;background:var(--panel-2);border-radius:99px;overflow:hidden;min-width:60px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--xp),#c6bcff);transition:width .5s}
.xpnum{font-size:13px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.streak{font-family:var(--f-display);font-weight:800;color:var(--hot);white-space:nowrap}
.mute{font-size:13px;color:var(--ink-3);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
/* home */
.hero{padding-block:34px 10px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,7vw,64px);line-height:.95;margin:0 0 10px;text-wrap:balance}
.hero h1 span{color:var(--gold)}
.hero p{color:var(--ink-2);margin:0;max-width:56ch}
.sect{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:28px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:center;background:var(--panel)}
.chip small{color:var(--ink-3);font-weight:400;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,210,63,.12)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mode{text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s;min-height:150px}
.mode:hover{transform:translateY(-3px);border-color:var(--c,var(--gold))}
.mode .ic{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--c,var(--gold));line-height:1}
.mode h3{font-family:var(--f-display);font-weight:800;font-size:21px;margin:4px 0 0}
.mode p{margin:0;color:var(--ink-2);font-size:14.5px}
.mode .best{margin-top:auto;font-size:13px;color:var(--ink-3);padding-top:8px}
.mastery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:40px}
.mastery div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mastery b{display:block;font-size:14.5px}
.mastery .m{height:6px;background:var(--panel-2);border-radius:99px;margin-top:8px;overflow:hidden}
.mastery .m i{display:block;height:100%;background:var(--good)}
.mastery .m{padding:0;border:0}.mastery .m.seg{display:flex}.mastery .m.seg i{flex:none}
.mastery small{color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums}
/* stage */
.stage{padding-block:22px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.back{border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink-2);font-size:14px}
.hud{display:flex;gap:16px;font-family:var(--f-display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.hud span{color:var(--ink-3);font-size:12px;letter-spacing:.1em;display:block;font-family:var(--f-body);font-weight:700}
.timer{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--gold);transition:width .1s linear}
.prompt{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:22px;font-size:clamp(19px,2.8vw,25px);font-weight:700;line-height:1.3;margin-bottom:14px}
.prompt small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;font-weight:700}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--panel-2);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;display:flex;gap:12px;align-items:flex-start;transition:transform .1s}
.opt:hover{border-color:var(--ink-3)}
.opt kbd{font-family:var(--f-display);font-weight:800;background:var(--bg);border-radius:6px;padding:0 7px;color:var(--ink-3);flex:none}
.opt.right{border-color:var(--good);background:rgba(61,220,151,.15)}
.opt.wrong{border-color:var(--bad);background:rgba(255,93,115,.15)}
.combo{font-family:var(--f-display);font-weight:800;color:var(--hot)}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.12)}}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* flashcard */
.fc{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;min-height:300px;padding:28px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none}
.fc .q{font-size:clamp(20px,3vw,27px);font-weight:700;text-align:center;line-height:1.3}
.fc .a{display:none;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-2);font-size:18px}
.fc.on .a{display:block}.fc.on .q{font-size:20px}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{font-family:var(--f-display);font-weight:800;border-radius:12px;padding:12px 20px;font-size:16px;border:1.5px solid var(--line);background:var(--panel-2)}
.btn.good{background:var(--good);color:#06281a;border-color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.gold{background:var(--gold);color:#2b2100;border-color:var(--gold)}
.btn:disabled{opacity:.35;cursor:default}
.hint{text-align:center;color:var(--ink-3);font-size:13px;margin-top:10px}
/* match */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:14px;line-height:1.3;min-height:96px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:opacity .3s,transform .15s}
.tile i{font-style:normal;font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.12em;color:var(--ink-3)}
.tile.q{border-color:#3d4280}.tile.q i{color:var(--xp)}
.tile.sel{border-color:var(--gold);transform:translateY(-2px);background:rgba(255,210,63,.1)}
.tile.gone{opacity:0;pointer-events:none;transform:scale(.9)}
.tile.no{border-color:var(--bad)}
/* boss */
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.fighter{display:flex;flex-direction:column;gap:6px;min-width:0}
.fighter b{font-family:var(--f-display);font-weight:800;font-size:17px}
.hp{height:12px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--bad);transition:width .4s}
.hearts{color:var(--bad);font-size:20px;letter-spacing:3px}
.vs{font-family:var(--f-display);font-weight:800;color:var(--ink-3)}
.bossface{font-family:var(--f-display);font-weight:800;font-size:44px;text-align:right;line-height:1}
.dmg{font-family:var(--f-display);font-weight:800;color:var(--gold);min-height:22px;text-align:right}
@media (max-width:560px){.arena{grid-template-columns:1fr;}.vs{display:none}.bossface,.dmg{text-align:left}}
/* tf */
.tf{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:24px;min-height:220px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.tf .q{font-size:clamp(18px,2.6vw,23px);font-weight:700}
.tf .a{color:var(--ink-2);font-size:17px;border-left:3px solid var(--xp);padding-left:12px}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tfrow .btn{padding:18px;font-size:20px}
/* results */
.res{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:26px;text-align:center}
.res h2{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,44px);margin:0 0 6px}
.res .big{font-family:var(--f-display);font-weight:800;font-size:56px;color:var(--gold);line-height:1;margin:10px 0}
.review{text-align:left;margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.review div{padding:10px 0;border-bottom:1px solid var(--line)}
.review b{display:block}.review span{color:var(--good)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);background:var(--xp);color:#fff;font-family:var(--f-display);font-weight:800;padding:10px 18px;border-radius:99px;z-index:20;transition:transform .35s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
/* session review + homework cue cards */
.sess{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1.5px solid var(--line);border-left:4px solid #5aa9ff;border-radius:16px;padding:14px 16px;margin-top:24px}
.sess b{display:block;font-family:var(--f-display);font-weight:800;font-size:18px}
.sess small{color:var(--ink-2);font-size:14px}
.sess .row{margin:0;justify-content:flex-end}
.hwhead{margin-bottom:16px}
.hwhead h2{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,44px);margin:0 0 6px}
.hwhead p{margin:0 0 4px;color:var(--ink-2)}
.hwhead small{color:var(--ink-3);font-size:13px}
.hwhead .row{justify-content:flex-start}
.cues{display:grid;gap:12px}
.cue{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);background:var(--panel);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.cue .cf{padding:16px;border-right:1.5px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.cue .cf small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.cue .cf b{font-size:17.5px;line-height:1.3}
.cue .cw{color:var(--gold);font-weight:700;font-size:14.5px}
.cue .cb{padding:16px;display:flex;flex-direction:column;gap:8px}
.cue .cb p{margin:0;font-size:16px}
.cue .chg{color:var(--ink-3);font-size:13.5px}
.cue details{font-size:14px;color:var(--ink-3)}
.cue summary{cursor:pointer}
.cue details p{font-size:14px;color:var(--ink-2);margin-top:6px}
.cs.good{color:var(--good)}.cs.part{color:var(--gold)}.cs.bad{color:var(--bad)}
@media (max-width:620px){.cue{grid-template-columns:1fr}.cue .cf{border-right:0;border-bottom:1.5px dashed var(--line)}}
@media print{
  body{background:#fff!important;background-image:none!important;color:#000}
  body::before,.bar,.top,.hwbtns,.toast,#fx,.hwhead .jnote,.cue details{display:none!important}
  .stage{padding:0}
  .hwhead *,.cue *{color:#000!important}
  .cue{grid-template-columns:1fr 1fr;background:#fff;border:1px dashed #777;border-radius:0;break-inside:avoid;page-break-inside:avoid}
  .cue .cf{border-right:1px dashed #777;border-bottom:0}
}


/* typing */
.typebox{display:flex;gap:10px;margin:12px 0;align-items:stretch}
.typebox textarea{flex:1;min-width:0;background:var(--panel-2);border:1.5px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;font-size:16px;padding:12px 14px;resize:vertical}
.typebox textarea:focus{outline:none;border-color:var(--gold)}
.typebox .btn{flex:none}
@media (max-width:520px){.typebox{flex-direction:column}}
mark.hit{background:rgba(61,220,151,.22);color:var(--good);border-radius:4px;padding:0 2px}
mark.miss{background:rgba(255,93,115,.18);color:#ffb3be;border-radius:4px;padding:0 2px}
.feedback{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:6px}
.feedback p{margin:10px 0 0;color:var(--ink-2);font-size:16.5px}
b.good{color:var(--good)} b.part{color:var(--gold)} b.bad{color:var(--bad)}
.verdict{margin-top:10px;font-size:14px;color:var(--ink-3)}
.prompt.special{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,63,.15)}
/* animated boss arena */
.hudrow{display:flex;justify-content:space-between;gap:16px}
.hudrow .pl,.hudrow .bs{display:flex;flex-direction:column;gap:4px;min-width:0}
.hudrow .bs{align-items:flex-end;flex:0 1 55%}
.hudrow b{font-family:var(--f-display);font-weight:800}
.hudrow .hp{width:100%;min-width:120px}
.hudrow small{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
  background:radial-gradient(ellipse at 50% 100%,rgba(139,123,255,.18),transparent 60%),linear-gradient(transparent 82%,rgba(255,255,255,.05) 82%)}
@keyframes breathe{50%{transform:scaleY(.97)}}
@keyframes bob{50%{transform:translateY(-8px) scale(1.02,.98)}}
@keyframes cast{40%{transform:rotate(-35deg)}100%{transform:rotate(0)}}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}90%{opacity:1}100%{opacity:0;transform:translate(var(--dx,300px),var(--dy,0px)) scale(1.3)}}
@keyframes monhurt{0%{filter:brightness(3) saturate(0)}30%{transform:translateX(14px) rotate(6deg)}60%{transform:translateX(-8px) rotate(-3deg);filter:none}100%{transform:none}}
@keyframes lunge{40%{transform:translateX(-46%) scale(1.12)}100%{transform:none}}
@keyframes hurt{0%,100%{filter:none}30%{filter:drop-shadow(0 0 10px var(--bad)) brightness(1.6);transform:translateX(-10px) rotate(-6deg)}}
@keyframes defeat{30%{transform:rotate(12deg) scale(1.1);filter:brightness(2)}100%{transform:rotate(-30deg) scale(0) translateY(40px);opacity:0}}
@keyframes rise{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-60px) scale(1)}}
@keyframes say{0%{opacity:0;transform:translate(-50%,6px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes quake{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

/* illustrated boss arena */
.arena3{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:12px 12px 12px;margin-bottom:14px;overflow:hidden}
.arena3 .hudrow{padding:0 4px 10px}
.scene{position:relative;width:100%;aspect-ratio:1672/941;border-radius:14px;overflow:hidden;background:#0b0c18;isolation:isolate}
.cam{position:absolute;inset:0;animation:drift 14s ease-in-out infinite alternate}
.ly{position:absolute;inset:0;background:var(--img) center/cover no-repeat}
.bossl,.herol{-webkit-mask-image:var(--mask);mask-image:var(--mask)}
.bossl{animation:loom 2.8s ease-in-out infinite}
.bossl.hurt{animation:bhurt .55s}
.bossl.lunge{animation:blunge .6s cubic-bezier(.5,0,.3,1)}
.bossl.dead{animation:bdead 1.4s forwards}
.herol{transform-origin:20% 90%}
.herol.strike{animation:hstrike .45s ease-out}
.herol.hurt{animation:hhurt .5s}
.herol.down{animation:none;transform:translateY(6%) rotate(-4deg);filter:grayscale(1) brightness(.6);transition:transform .8s,filter .8s}
.scene.lost .base,.scene.lost .bossl{filter:saturate(.4) brightness(.7);transition:filter .8s}
.slash{position:absolute;left:var(--tx);top:var(--ty);width:18%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(-30deg) scale(.3);border-radius:50%;border:6px solid transparent;border-top-color:#fff6c8;filter:drop-shadow(0 0 10px var(--gold));opacity:0;pointer-events:none}
.slash.go{animation:slash .4s ease-out}
.orb2{position:absolute;left:var(--tx);top:var(--ty);width:5%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;
  background:radial-gradient(circle,#fff,var(--gold) 45%,rgba(255,210,63,0) 72%);box-shadow:0 0 26px 10px rgba(255,210,63,.6)}
.orb2.big{width:8%;box-shadow:0 0 40px 16px rgba(255,138,61,.7)}
.orb2.fly{animation:fly2 .4s ease-in forwards}
.burst{position:absolute;left:var(--cx);top:var(--cy);width:30%;aspect-ratio:1;transform:translate(-50%,-50%) scale(0);border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,210,63,.6) 30%,rgba(255,93,115,0) 65%)}
.burst.pop{animation:burst .5s ease-out}
.floats2{position:absolute;left:var(--cx);top:var(--cy);width:0;height:0;pointer-events:none}
.fl2{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:800;white-space:nowrap;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.8);animation:rise2 1.1s ease-out forwards}
.fl2.dmg{color:var(--gold);font-size:clamp(22px,4vw,40px)} .fl2.crit{color:var(--hot);font-size:clamp(28px,5.5vw,54px)} .fl2.critx{color:#fff;font-size:clamp(12px,1.8vw,18px);letter-spacing:.12em;top:clamp(26px,4vw,46px)}
.fl2.ouch{color:var(--bad);font-size:clamp(20px,3.6vw,36px);left:-38vw;top:12vw}
.taunt2{position:absolute;left:var(--cx);top:4%;transform:translateX(-50%);background:#fff;color:#14152b;font-weight:700;font-size:clamp(11px,1.6vw,15px);padding:5px 12px;border-radius:12px;opacity:0;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.taunt2.say{animation:say 1.9s ease forwards}
.vig{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 90px 30px rgba(255,40,60,.85)}
.vig.flash{animation:vig .6s ease-out}
.stamp2{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-8deg) scale(2.2);font-family:var(--f-display);font-weight:800;font-size:clamp(30px,7vw,72px);color:var(--gold);border:5px solid var(--gold);padding:2px 18px;border-radius:10px;opacity:0;pointer-events:none;text-shadow:0 3px 0 #000;background:rgba(0,0,0,.35)}
.stamp2.bad{color:var(--bad);border-color:var(--bad)}
.stamp2.show{animation:stamp2 .45s cubic-bezier(.3,1.6,.5,1) forwards}
.cam.quake{animation:quake .45s}
.cam.kick{animation:kick .35s}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.06) translate(-1%,.5%)}}
@keyframes loom{50%{transform:scale(1.015)}}
@keyframes bhurt{0%{filter:brightness(2.6) saturate(.2)}25%{transform:translate(1.5%,-.5%)}50%{transform:translate(-1%,.5%);filter:brightness(1.4) hue-rotate(-20deg)}100%{transform:none;filter:none}}
@keyframes blunge{40%{transform:scale(1.1) translate(-4%,3%);filter:brightness(1.3) drop-shadow(0 0 20px rgba(255,40,60,.8))}100%{transform:none}}
@keyframes bdead{0%{filter:brightness(3)}20%{transform:translate(1%,0)}30%{transform:translate(-1%,0)}100%{filter:grayscale(1) brightness(.35) blur(1px);transform:scale(.97) translateY(2%)}}
@keyframes hstrike{35%{transform:translate(2.5%,-1%) rotate(1.5deg)}100%{transform:none}}
@keyframes hhurt{0%,100%{filter:none;transform:none}30%{filter:brightness(1.4) saturate(1.6);transform:translate(-1.5%,.5%) rotate(-1.5deg)}}
@keyframes slash{0%{opacity:1;transform:translate(-50%,-50%) rotate(-60deg) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) rotate(40deg) scale(1.1)}}
@keyframes fly2{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}85%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.4)}}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
@keyframes rise2{0%{opacity:0;margin-top:10px}20%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-60px}}
@keyframes vig{0%{opacity:1}100%{opacity:0}}
@keyframes stamp2{to{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
@keyframes kick{30%{transform:scale(1.07)}100%{transform:scale(1.04)}}

/* AI judge feedback */
.feedback .jhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.feedback .jhead b{font-family:var(--f-display);font-size:20px}
.jscore{font-family:var(--f-display);font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.by{margin-left:auto;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--xp);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.jfb{margin:10px 0 0;color:var(--ink);font-size:16.5px}
.missing{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.missing small,.model small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;width:100%}
.missing span{background:rgba(255,93,115,.14);border:1px solid rgba(255,93,115,.4);color:#ffc2cb;border-radius:8px;padding:3px 8px;font-size:14px}
.model{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);color:var(--ink-2);font-size:15.5px}
.jnote{margin:10px 0 0;font-size:13px;color:var(--ink-3)}
.feedback.thinking{color:var(--ink-2);display:flex;align-items:center;gap:10px}
.gavel{display:inline-block;color:var(--gold);font-size:20px;animation:gavel .8s ease-in-out infinite}
@keyframes gavel{50%{transform:rotate(-25deg)}}

/* confidence buttons (Brainscape-style) */
.confq{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--ink-2);margin:16px 0 8px;text-align:center}
.conf{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cbtn{border:2px solid var(--cc);background:color-mix(in srgb,var(--cc) 12%,var(--panel));color:var(--ink);border-radius:12px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,background .15s}
.cbtn b{font-family:var(--f-display);font-size:22px;line-height:1;color:var(--cc)}
.cbtn span{font-size:12px;color:var(--ink-2);white-space:nowrap}
.cbtn:not(:disabled):hover{transform:translateY(-2px);background:color-mix(in srgb,var(--cc) 26%,var(--panel))}
.cbtn:disabled{opacity:.3;cursor:not-allowed}
.cbtn.sug{background:var(--cc);box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 35%,transparent)}
.cbtn.sug b,.cbtn.sug span{color:#121225}
.cbtn.sug::after{content:'suggested';font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#121225;font-weight:700}
.feedback .conf{margin-top:2px}
.ovrow{margin-top:10px}.ovrow .btn{font-size:14px;padding:9px 14px}
.fbk p{margin:10px 0 0;color:var(--ink);font-size:16px}
.fbk small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.fbk .ok small{color:var(--good)} .fbk .fix small{color:var(--gold)}
@media (max-width:520px){.conf{gap:5px}.cbtn{padding:9px 2px 8px}.cbtn span{font-size:10.5px;white-space:normal;text-align:center;line-height:1.15}.cbtn.sug::after{font-size:8.5px}}
/* subjects */
.subjs{display:flex;flex-wrap:wrap;gap:8px}
.subj{font-family:var(--f-display);font-weight:800;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;background:var(--panel);display:flex;gap:8px;align-items:baseline}
.subj small{font-family:var(--f-body);font-weight:400;color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
.subj[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,210,63,.12);color:var(--gold)}
/* command terms */
.term{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#121225;background:var(--gold);border-radius:6px;padding:2px 8px;margin-right:6px;vertical-align:2px}
.fc .term{margin:0 auto 10px;display:table}
.termdef{margin:0 0 12px;font-size:14.5px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:10px 12px}
.termdef b{color:var(--ink)}
.termdef summary{cursor:pointer;color:var(--ink)}
.termdef p{margin:8px 0 0}
.tmet{margin:10px 0 0;font-size:15.5px}
.tmet small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.tmet.ok small{color:var(--good)} .tmet.no small{color:var(--bad)}
.exbox textarea{min-height:190px}
.wc{font-size:13px;color:var(--ink-3);text-align:right;margin-top:-6px;font-variant-numeric:tabular-nums}
.big.marks{font-size:44px}
/* name plate over reused boss art */
.plate{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(#1b2547,#121a35);border:2px solid #c9a24a;border-radius:8px;box-shadow:0 0 0 2px #121a35,0 4px 14px rgba(0,0,0,.5);color:#f3d98b;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:clamp(10px,2.1vw,22px);line-height:1.05;padding:0 4%;text-shadow:0 1px 0 #000}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const DECKS = [{"subject":"Global Politics","name":"Foundations","boss":"The Anarchy","art":0,"cards":[["The four stages of the political decision-making process?","Ideology (what are our values and goals?), political system (how and by whom are decisions made?), power (can we implement our solution?), policies (what we'll do and how)",1],["Power (Joseph Nye)?","\"The ability to alter the behaviour of others to get what you want\"; also the capacity to do something",2],["Hard power?","Using coercion and/or incentives to change behaviour; tangible and measurable (e.g. military force, sanctions)",3],["Soft power?","Using persuasion and/or attraction to change behaviour; intangible and hard to measure (e.g. culture, values, reputation)",4],["Nye's three sources of US soft power?","Cultural, ideological and institutional: liberal democracy, free markets and human rights make others want to follow",5],["Five ways political actors exercise power?","Political/legal (rules), military (violence), economic (money and inducements), cultural (values, language, lifestyle), psychological (manipulating thoughts and emotions, e.g. propaganda)",7],["Authority?","The moral or legal right to exercise power over others; power exercised with society's consent. Also the person or institution holding that right",8],["Authority vs authoritarian?","Authority is an accepted right to rule; an authoritarian is a leader or regime that controls people through domination without consent",9],["Traditional authority?","Rooted in long-standing customs and inherited roles (e.g. a monarch, the Pope, a parent)",10],["Legal (legal-rational) authority?","Rooted in laws and institutions; it sits in the office, not the person (e.g. a president, police officer, mayor)",11],["Charismatic authority?","Rooted in a leader's personal qualities and popularity; hard to pass on when they die (e.g. Churchill, Hitler, a social media personality)",12],["Ideology?","A system of ideas and values that forms the basis of economic, political or social theory and policy (usually ending in -ism)",13],["Three things all ideologies do?","Make assumptions about human nature and society; create universal values to guide decisions; advocate an ideal society",14],["Liberalism: view of human nature?","Humans are rational and motivated by enlightened self-interest; happiest pursuing their own desires as long as they don't harm others",15],["Liberalism: ideal society?","Minimal government interference; laws and institutions protecting individual freedoms, free markets and equal rights",16],["Socialism: view of human nature?","Humans are social, cooperative creatures who feel responsible for others and work best together",17],["Socialism: ideal society?","Equality: equal access to services, communally owned means of production, reduced inequality so class (and race) divisions disappear",18],["Conservatism: view of human nature?","Humans are emotional, irrational, naturally selfish and violent; traditions evolved over generations keep these tendencies in check",19],["Conservatism: ideal society?","Government protects traditional institutions, religion, gender roles and customs; traditional rulers lead; change is gradual",20],["Political system?","The organisation and structure used to govern a society: its institutions and processes for managing power, authority and decisions",22],["Full (liberal) democracy (Zakaria)?","\"Free and fair elections but also the rule of law, separation of powers and the protection of basic liberties\"",23],["Five features of a liberal democracy?","Regular free and fair elections; multiple parties; protected rights and freedoms (incl. free media); rule of law; separation of powers",24],["Rule of law: core idea?","No-one is above the law, including lawmakers, judges and monarchs; laws apply equally to all",25],["Authoritarian regime?","Power concentrated in one person (autocracy) or a small elite (oligarchy); no real elections, opposition suppressed, no guaranteed rights",28],["Five types of authoritarian regime, with examples?","Totalitarian (Nazi Germany); absolute monarchy (Saudi Arabia); one-party state (China); military junta (Myanmar); theocracy (Iran)",29],["Illiberal democracy?","A system mixing democratic and authoritarian elements, e.g. elections held but freedoms, courts, media or minority rights weakened",30],["Flawed democracy?","Fair elections and basic liberties but problems such as limited media freedom or weak opposition",31],["Hybrid regime?","Combines autocratic and democratic features: elections sometimes rigged, some liberties protected and others not",32],["Soft authoritarianism?","An authoritarian regime that pretends to be democratic; democratic institutions are mostly for show",33],["Democratic backsliding?","Elected leaders using their power to erode democratic institutions, rules and norms",34],["Sovereignty?","The exclusive authority to exercise power within a defined territory",35],["Internal sovereignty?","A state's ability to make and enforce its own rules within its borders",36],["External sovereignty?","Recognition of a state by other states and the international community",37],["Taiwan vs DR Congo: sovereignty examples (Barkin)?","Taiwan has strong internal sovereignty but limited external recognition; the DRC has full external sovereignty but weak internal control of its territory",38],["Four characteristics of a state (Montevideo Convention, 1933)?","Defined territory, permanent population, government (internal sovereignty), and capacity to enter agreements with other states (external sovereignty)",39],["The state system?","The global system of sovereign states created by the Treaties of Westphalia (1648), based on mutual recognition of sovereignty and non-intervention",41],["Key features of the state system?","States are the primary actors; only states make treaties and join international organisations; mutual recognition of sovereignty; anarchy (no higher authority)",42],["What does \"anarchy\" mean in the state system?","No authority above states to enforce rules or settle disputes; it doesn't necessarily mean chaos, but stronger states can often impose their will",43],["Domestic law vs international law?","Domestic: imposed by government, compulsory, enforced with punishments. International: voluntary agreements between equals, enforced only by condemnation or isolation",44],["Purpose of the UN?","To maintain international peace and security, promote cooperation and respect for international law, and protect human rights, based on the sovereign equality of states",45],["UN General Assembly (UNGA): structure?","All 193 members, one vote each (sovereign equality); meets annually Sept–Dec in New York",46],["UN General Assembly: role?","Main forum for debating global issues; passes non-binding resolutions reflecting international consensus; elects UNSC members and the Secretary-General; sets the UN budget",47],["UN Security Council (UNSC): structure?","15 members: 5 permanent (US, UK, France, Russia, China) with veto power, plus 10 non-permanent elected by the UNGA for two-year terms by region",48],["UN Security Council: role?","Maintains international peace and security; its resolutions are binding; can impose sanctions and authorise force",49],["What is the veto?","Any permanent member can block a UNSC resolution even if all others agree; members can abstain instead",50],["International Court of Justice (ICJ)?","The UN's court in The Hague: 15 judges settle legal disputes between states that agree to attend; rulings are binding but can't be enforced",53],["Treaty?","A formal written agreement between two or more states setting out legally binding commitments (also called an accord, pact, protocol or convention)",56],["Bilateral vs multilateral treaty?","Bilateral: between two states (e.g. a free trade agreement). Multilateral: three or more (e.g. the Geneva Conventions, UN climate convention)",57],["Process of making a treaty?","Negotiate terms, sign (agree to the terms), ratify (pass domestic law), then the treaty comes into force; signing without ratifying means it doesn't apply",58],["Why do states make treaties?","Clear rules, cooperation, trust and stability; avoiding conflict; solving shared problems; fair trade; protecting rights; reputation",59],["Development?","The process by which low-income, traditional, agriculture-based economies become industrial economies with high living standards; a relative spectrum",61],["GDP and GDP per capita?","GDP is the total goods and services an economy produces; GDP per capita is GDP divided by population (higher generally means better living standards)",62],["Human Development Index (HDI)?","Combines life expectancy, education and income per person into a score; closer to 1.0 means more developed",63],["Gini coefficient?","Measures inequality of wealth or income; closer to 100 (or 1) means MORE unequal (note: one slide in this booklet says the opposite, which is wrong)",64],["Developed countries?","Wealthy, industrialised, high living standards, more even wealth, service and high-tech economies (e.g. Australia, USA, Japan, France)",65],["Developing countries?","Industrialising, lower living standards, high inequality, manufacturing and agriculture economies (e.g. China, India, Brazil, South Africa)",66],["Least developed countries (LDCs)?","Poorest countries: very low GDP, poor infrastructure, subsistence agriculture, aid-dependent (e.g. South Sudan, Afghanistan, Haiti, East Timor)",67],["Unipolar, bipolar and multipolar international systems?","Unipolar: one dominant great power (the US after 1991). Bipolar: two rival superpowers with their own spheres of influence (the US and USSR in the Cold War). Multipolar: several great powers of similar strength, each with influence over smaller states",1000],["Which international system is emerging today, and why does it matter?","Many argue the world is becoming multipolar as China, Russia and India rise and US dominance declines; Russia and China openly call for a multipolar world to limit US influence and Western norms",1001]],"exam":[{"t":"Define","m":2,"q":"Define the term sovereignty.","g":"Precise meaning: supreme, independent authority over a territory and its people. Essential qualities: internal sovereignty (control within borders) and external sovereignty (recognition by other states, freedom from outside interference)."},{"t":"Explain","m":4,"q":"Explain the difference between hard power and soft power, using examples.","g":"Hard power: coercion or incentives, tangible (military force, sanctions). Soft power: persuasion and attraction, intangible (culture, values, institutions; Nye's three sources of US soft power). One example of each and how it changes behaviour."},{"t":"Compare","m":4,"q":"Compare a liberal democracy with an authoritarian regime.","g":"Features of liberal democracy (free and fair elections, rule of law, separation of powers, civil liberties) vs authoritarian (power concentrated, limited or sham elections, repression, censorship). Similarities and differences, and what they mean for citizens."},{"t":"Explain","m":6,"q":"Explain the role and structure of the UN Security Council.","g":"Structure: 15 members, 5 permanent members with the veto, 10 elected. Role: international peace and security, binding resolutions, sanctions, peacekeeping. Explain the significance of the veto (e.g. Russia on Ukraine)."},{"t":"Analyse","m":6,"q":"Analyse whether the international system today is unipolar, bipolar or multipolar.","g":"Define each system; identify evidence (US military and economic lead; China's rise; Russia, the EU, India; the BRICS); relate the evidence to the categories and draw out implications for stability and competition. Reach a reasoned characterisation."}]},{"subject":"Global Politics","name":"USA","boss":"The Electoral Eagle","art":1,"cards":[["USA: GDP and share of world GDP?","About $20.8 trillion, roughly 24% of world GDP",1],["USA: GDP per capita, HDI, Gini?","About $59,500 per capita (6th); HDI 0.927 (very high, 20th); Gini 41 (53rd of 130), so relatively unequal",2],["Why is the US Constitution (1787) significant?","It is the oldest constitution still in use and the first to set out liberal democratic values; it limits government power and protects individual liberty",5],["How did WW2 transform US power?","It entered late and avoided Europe's destruction; its military grew without economic damage; it helped found the UN and promoted liberal values",10],["US role during the Cold War?","Competed with the USSR for influence in Asia, Africa and Latin America and built alliances with democracies in Europe and Asia",11],["US role after 1991?","The only superpower: humanitarian interventions (Africa, Yugoslavia), promoting democracy, and the War on Terror (Afghanistan 2001–21, Iraq 2003–)",12],["Arguments that the USA is in decline?","Rising China and India; polarisation and inequality making its system dysfunctional; reduced appeal of its democracy; \"America First\" alienating allies",13],["Arguments that the USA is not in decline (Nye, 2024)?","Decline fears are cyclical (e.g. Sputnik 1957); the US keeps advantages in demography, energy, technology, universities, alliances and soft power",14],["What is federalism in the USA?","Power is divided between a federal government (Washington DC) and 50 state governments, which have more power than Australian states, plus 3,143 counties",15],["Who makes up the US executive?","The President and Vice President (elected every 4 years, maximum 8 years) and a Cabinet appointed by the President from outside Congress",18],["What is Congress?","The US legislature: House of Representatives (435 members, elected every 2 years) and Senate (100 senators, 6-year terms, a third elected every 2 years)",19],["What is the Supreme Court?","The highest court: 9 justices appointed by the President, confirmed by the Senate, serving for life; decides whether laws are constitutional",20],["What is separation of powers?","Power is split between the legislature (makes laws), executive (puts laws into action) and judiciary (interprets and enforces laws), so no branch dominates",21],["Examples of checks and balances in the USA?","President can veto laws; Congress can impeach the President and judges and controls funding; the Court can strike down unconstitutional laws",22],["What is gerrymandering?","Drawing electoral boundaries to favour one party, possible where state legislatures (not independent commissions) draw them",26],["Who tends not to vote in the USA, and why?","Poorer, younger, Hispanic and Asian-American people; barriers like voter ID, registration problems, felony disenfranchisement (~10% of Florida adults) and roll purges, plus apathy",27],["Why does the USA have a two-party system?","The electoral design makes it very hard for minor parties to win, and constant expensive campaigns favour big parties",28],["Republican Party (GOP): ideology and base?","Conservative, centre-right: lower taxes and regulation, Christian and family values; base of evangelicals, rural people, non-graduates and older voters in the South, interior and rural areas",29],["Democratic Party: ideology and base?","Liberal, centre-left: more welfare spending, higher taxes on the wealthy, progressive values; base of minorities, graduates, city-dwellers and young people in the North, Pacific coast and cities",30],["How have US political values changed since 1994?","Polarisation: Democrats and Republicans share fewer values and both have moved further apart",31],["What is the Electoral College?","538 electors allocated by state population; the winner of a state usually takes all its electors; 270 are needed to win",34],["Criticisms of the Electoral College?","A candidate can win without the popular vote (Clinton won more votes in 2016 but lost); winner-takes-all ignores minority voters; small rural states over-represented; campaigns focus only on swing states",36],["Urban–rural divide in US politics?","Cities are younger, richer, more educated and diverse, and vote Democrat; rural areas are older, poorer, more religious and whiter, and vote Republican",41],["How do Americans view freedom versus equality?","Nearly 60% of Americans rank freedom above equality (Europeans the reverse); Americans prefer less government intervention, low redistribution and gun rights",43],["What are the culture wars?","Bitter conflicts over identity and values (religion, race, gender, guns) between progressive and conservative Americans that deepen polarisation and undermine democracy",44],["What is foreign policy?","The goals, strategies and actions a state pursues in its relations with other actors in the international system",45],["What is the national interest?","Anything that increases a state's power, security or prosperity",46],["What shapes a state's foreign policy?","National interest, ideology and domestic politics (changes of government, public pressure, interest groups, distracting from problems at home)",47],["Four core principles of US foreign policy?","Security, democracy (supporting elections and human rights), prosperity (investment and free trade), development (fighting disease, promoting growth)",49],["US isolationism (\"America First\")?","The default from 1788 to 1941: trade abroad but avoid alliances, foreign wars, international institutions and treaties limiting US sovereignty",50],["US interventionism (\"World Policeman\")?","The default since WW2: global leadership promoting democracy, human rights and capitalism through alliances (NATO, UN), multilateral treaties and military intervention",51],["Scale of the US global military presence?","In 2022, over 171,000 personnel at about 750 bases in at least 80 countries",52],["Examples of Trump's \"America First\" withdrawals?","First term: Paris Agreement, Trans-Pacific Partnership, Iran nuclear deal; 20 Jan 2025: ordered withdrawal from Paris again; cut aid and UN funding",53],["Trump's trade policy?","Tariffs to protect US jobs, claiming free trade lets others exploit America (e.g. promised 60% on Chinese goods, 20% on other imports)",54],["Trump's stance on alliances and territory?","Says NATO members freeload by spending under 2% of GDP on defence; wants fewer troops abroad; has floated taking the Panama Canal and Greenland and making Canada a US state",55],["Why do some Americans oppose interventionism?","Seen as expensive, sometimes immoral, and diverting money from domestic needs like healthcare and education",56]],"exam":[{"t":"Explain","m":4,"q":"Explain how separation of powers and checks and balances limit power in the USA.","g":"Three branches (the executive, Congress, the Supreme Court) with distinct powers; examples of checks (veto, veto override, judicial review, Senate confirmation, impeachment). Show how each check prevents concentration of power."},{"t":"Evaluate","m":6,"q":"Evaluate the argument that the USA is in decline.","g":"For decline: falling share of world GDP, polarisation, China's rise, damage to alliances. Against (Nye 2024): military reach, alliances, innovation, soft power, demographics, dollar dominance. Weigh both with evidence and reach a judgement."},{"t":"Discuss","m":6,"q":"Discuss the strengths and weaknesses of the Electoral College.","g":"Balanced: strengths (federalism, protects smaller states, clear outcomes) vs criticisms (winner can lose the popular vote, swing-state focus, unequal vote weight). A considered conclusion."},{"t":"Compare","m":4,"q":"Compare US isolationism and US interventionism as foreign policy approaches.","g":"Isolationism ('America First': withdrawals, tariffs, scepticism of alliances) vs interventionism ('world policeman': global military presence, alliances, Cold War containment). Similarities (the national interest) and differences, with examples and their significance."}]},{"subject":"Global Politics","name":"Russia","boss":"The Tsar Bear","art":2,"cards":[["Russia: GDP and share of world GDP?","About $2 trillion, roughly 3.5% of world GDP",2],["Russia: GDP per capita, HDI, Gini?","About $13,800 per capita (68th); HDI 0.821 (very high, 56th); Gini 36 (76th of 154)",3],["What was Kievan Rus?","The first state in what is now Russia, founded 862 CE with its capital at Kiev; converted to Orthodox Christianity in 980 CE",5],["How did the Orthodox Church shape Russian identity?","It was the official religion that legitimised the Tsars; Russia saw itself as the \"Third Rome\" and drew a sharp line between Western civilisation and a unique Russian identity",11],["What was the USSR?","A one-party socialist state (1922–91) with no private enterprise, dominated by Russia but including republics now independent, such as Ukraine",13],["What were glasnost and perestroika?","Gorbachev's 1985 reforms (openness and restructuring) meant to boost the economy and win support; instead they worsened shortages and inflation and fuelled independence movements",15],["When was the USSR dissolved, and into how many states?","25 December 1991, into 15 republics; the Russian Federation took the USSR's UN Security Council seat",16],["What happened in Russia under Yeltsin (1991–99)?","Multi-party elections and a new constitution, but a \"super presidency\"; privatisation brought unemployment, inflation, corruption and rule by oligarchs",17],["Who were the oligarchs?","Billionaires who used political or criminal connections to buy state enterprises cheaply in the 1990s; by the mid-1990s seven men controlled about 50% of the economy",18],["Why did many Russians come to associate democracy with weakness?","The chaotic 1990s: economic collapse (inflation up about 2500%), crime, corruption and Yeltsin's erratic, drunken public behaviour",19],["What did the 1993 constitution create?","A federal democratic republic with a powerful President and a two-house Federal Assembly",20],["What powers does the Russian president have?","Appoints the Prime Minister, ministers and judges; commander-in-chief; can declare martial law",22],["What was Putin's background?","KGB agent in East Germany in the 1980s; head of the FSB under Yeltsin; became PM in 1999 and president when Yeltsin resigned (Dec 1999), elected 2000",24],["How did Putin centralise power after 2000?","Cut regional powers, reduced the parties allowed to run, took control of TV and the internet, and renationalised up to 70% of the economy",25],["How did Putin deal with the oligarchs?","They could keep making money if they stayed out of politics; loyalists kept their empires, while opponents were arrested and had assets seized",26],["How did Putin get around term limits?","PM 2008–12 (tandem with Medvedev); returned in 2012 with 6-year terms; 2020 amendments allow two more terms, so potentially in power to 2036",27],["Putin's quote about the USSR's collapse?","\"The greatest geopolitical catastrophe\" of the 20th century",29],["How has Putin kept control of elections? (Freedom House 2024)","Preferential media coverage; rivals disqualified (e.g. Navalny 2018); electoral laws and timing manipulated; \"foreign agents\" barred; opaque online voting",30],["What is United Russia?","Putin's party; won 324 of 450 Duma seats in 2021, a supermajority; other parties are Kremlin-approved \"opposition\"",31],["Why does Putin hold elections if they are not free?","To give his rule legitimacy at home and abroad and show apparent popular support",32],["Democratic features of Russia's system (on paper)?","A constitution, elected Duma, multiple parties, federal structure",33],["Evidence Russia is authoritarian?","Super-powerful president, no real term limits, controlled media, banned or jailed opposition, rigged elections, crackdowns on protest",34],["What is Russian exceptionalism?","The belief that Russia is a unique civilisation of all Russian speakers, fundamentally different from the West and threatened by outside forces",35],["What is Putin's anti-liberalism?","The claim that the West is decadent and has abandoned Christian and family values, so Russia must resist Western culture",36],["Examples of Putin's social and cultural policies?","2013 anti-LGBTQI+ \"propaganda\" law; patriotic curriculum and rewritten textbooks (2023); military lessons and Family Studies (2024); censorship; pro-birth policies",37],["What is Russia's \"foreign agent\" law (2012)?","Any group with outside support can be labelled a foreign agent and fined or shut down",39],["Who was Aleksey Navalny?","Anti-corruption activist and Putin's leading critic; blogger with over 1 million monthly views by 2010",42],["How did the state silence Navalny? (timeline)","2013 embezzlement conviction; 2016 his party deregistered; 2018 barred from presidency; 2020 poisoned with Novichok; 2021 arrested on return; died in the IK-6 Arctic prison (2024)",44],["What does Navalny's case show about Russia?","It is authoritarian: courts, poison and prison are used to remove genuine opposition",45],["What is Russia's \"Near Abroad\"?","The former Soviet republics, which Russia claims as its sphere of influence and essential to its security",46],["Which post-Soviet states joined NATO and the EU in 2004?","The Baltic states: Lithuania, Latvia and Estonia",47],["Which post-Soviet states remain close to Moscow?","Belarus, Turkmenistan and other authoritarian states",48],["Why does Russia have leverage in the Near Abroad?","Economic dependence on Russia, plus large Russian-speaking minorities (over 30% in some states) that complicate national identity",49],["Where has Russia intervened militarily in former Soviet states?","Moldova (1990–92), Georgia (2008), Ukraine (2014 and 2022)",50],["How does Russia's Foreign Policy Concept describe the West?","Calls globalisation and democratisation \"imperialism\" and \"neo-colonialism\"; accuses the West of an \"aggressive anti-Russian policy\" to \"destroy Russia\"; lists 48 \"unfriendly\" countries",51],["How does Russia interfere in Western elections?","Internet Research Agency hacking; fake bots and profiles amplifying division on both left and right; RT propaganda; funding pro-Russian parties and influencers; tried to influence 11 elections in 9 democracies (2020–22)",52],["What is BRICS?","A 2011 bloc of Brazil, Russia, India, China and South Africa; expanded in 2024 (Egypt, Ethiopia, Indonesia, Iran, UAE) as a non-Western economic alternative based on non-interference",54],["Which authoritarian regimes has Russia supported?","Assad in Syria (2011–24); North Korea and Iran, which supply weapons for Ukraine in exchange for diplomatic support",55],["What are Russian PMCs?","Private military companies (e.g. Wagner) linked to the Kremlin, giving deniable training, weapons and troops, especially in Africa",56],["What is Russia's \"anti-colonial\" strategy in Africa?","Presents Russia as fighting Western neo-colonialism (e.g. the 2024 \"For the Freedom of Nations\" forum) while using disinformation via RT, TASS and Sputnik to win influence",57],["Isolationist foreign policy?","Avoiding foreign entanglements and military alliances; prioritising domestic issues and the economy",58],["Interventionist foreign policy?","Playing an active role in world affairs, spreading ideals by diplomacy or force, and protecting allies (acting as \"world policeman\")",59]],"exam":[{"t":"Explain","m":6,"q":"Explain how Vladimir Putin centralised power in Russia after 2000.","g":"Control over the oligarchs, media and regional governors; United Russia's dominance; getting around term limits (job swap with Medvedev, 2020 amendments); managed elections; repression of opposition (Navalny, the foreign agent law). Link each to centralisation."},{"t":"Evaluate","m":6,"q":"Evaluate the claim that Russia is an authoritarian state.","g":"Democratic features on paper (1993 constitution, elections, parliament) vs the reality (rigged elections per Freedom House, repression, censorship, Navalny's death, the foreign agent law). Weigh the evidence and give a judgement."},{"t":"Explain","m":4,"q":"Explain why Russia seeks influence over its 'Near Abroad'.","g":"Security buffer, historical and cultural ties, Russian-speaking populations, opposition to NATO and EU expansion (2004), energy leverage; examples (Georgia 2008, Ukraine 2014 and 2022). Show the motives and the means."}]},{"subject":"Global Politics","name":"China","boss":"The Red Dragon","art":3,"cards":[["China: total GDP and share of world GDP?","$19.4 trillion, about 19% of world GDP",1],["China: GDP per capita and HDI?","About $12,969 per capita (70th); HDI 0.788 (high, 75th)",2],["Why is China still classed as a developing nation?","Mid-range HDI (0.788) and Gini (38.2, 67th of 154) and a low GDP per capita (~$13,000) despite a huge total GDP",3],["Largest ethnic group in China?","Han Chinese, about 91% of the population; 55 recognised minorities (e.g. Tibetans, Uyghurs) make up the rest",5],["When was the People's Republic of China proclaimed?","October 1949, by Mao Zedong (Chiang's GMD government fled to Taiwan in early 1949)",10],["What is Taiwan's official name and origin?","Republic of China; set up by the defeated GMD after 1949, claiming to be the rightful government of all China",11],["Until when did the UN recognise Taiwan as China's government?","1971 (Taiwan held China's UN Security Council seat and veto until then)",12],["What is the One China Principle?","Beijing's position that Taiwan is a breakaway province of China; it refuses relations with any country that recognises Taiwan as independent",13],["What is the US position on Taiwan's sovereignty?","An \"as yet unsettled issue\": the US rejects Beijing's claim and does not recognise Taiwan as independent; both sides should resolve it peacefully (while the US keeps an unofficial alliance with Taiwan)",14],["Why is Taiwan a flashpoint between China and the West?","China says it may use force to take Taiwan; most Taiwanese want independence; Taiwan is a US partner, so a China–Taiwan war would likely draw in the US",15],["How does China's constitution describe its system of government?","A \"people's democratic dictatorship\": the CCP acts for the people but uses dictatorial powers to prevent counter-revolution",16],["What is the National People's Congress (NPC)?","China's legislature (~3,000 indirectly elected delegates, meeting two weeks a year); officially the \"highest organ of state power\", in reality a rubber stamp for the CCP",17],["What is the Politburo?","The CCP's top decision-making body (about 25 members) that holds real political power",18],["What is the Politburo Standing Committee?","The inner group of seven within the Politburo that makes the major decisions",19],["What are the 4 key aspects of China's political system (Brazilian Centre for International Relations, 2021)?","1) Authoritarianism (power in a small unelected elite) 2) Party-state (CCP controls government, economy, media, society) 3) Meritocracy (career officials promoted on skill and loyalty) 4) Democratic features (grassroots and intra-party democracy, civilian control of military)",20],["How does meritocracy work in the CCP?","Officials must score well on university exams and serve in local government before promotion, so leaders are experienced, knowledgeable and loyal",21],["How has Xi Jinping concentrated power since 2013? (4 ways)","Anti-corruption campaigns that remove rivals; removal of term limits (third term, 2022); stacking the Politburo with loyalists; \"Xi Jinping Thought\" and a personality cult, plus tighter censorship",25],["What three top posts does Xi hold?","General Secretary of the CCP, President of China, Chairman of the Central Military Commission",27],["What is the Chinese Dream?","Xi's 2013 vision for the \"great rejuvenation of the Chinese nation\", reversing the century of humiliation and restoring China's dominance in Asia",28],["What was the \"century of humiliation\" (century of shame)?","Foreign encroachment on China, roughly 1839/1849–1949, when Western powers and Japan weakened China, exploited it and took territory",29],["The four parts of the Chinese Dream?","Strong China (economy, military, technology); Civilised China (pride in traditional culture, not Western ideas); Harmonious China (class unity under the CCP); Beautiful China (sustainable development, less pollution)",30],["What are the \"Two Centenaries\" goals?","A \"moderately well-off society\" by 2021 (CCP centenary) and a \"fully developed nation\" by 2049 (PRC centenary)",31],["What is Made in China 2025?","A 2015 policy to shift China from the \"world's factory\" to an innovation-driven economy, promoting 10 high-tech industries (EVs, renewables, robotics, biomedicine, AI) through subsidies and targets",32],["Criticisms of Made in China 2025?","Accused of intellectual property theft and forced technology transfer from foreign firms; reliant on state subsidies; other countries now restricting technology and subsidising their own industries",34],["How many people has China lifted out of poverty since the 1970s?","Over 800 million; in 2021 the government declared extreme poverty eradicated (growth concentrated in eastern cities)",36],["What is the Great Firewall?","China's internet censorship system that blocks Western websites, forcing use of Chinese apps (WeChat, Weibo) and filtering terms like \"democracy\" and \"Taiwan independence\"",37],["What is China's social credit system?","A planned national system giving citizens a score that rises or falls with behaviour; high scores are rewarded, low scores punished, using financial, government and online data and facial recognition",38],["Examples of human rights restrictions in China?","Censorship and surveillance; persecution of unregistered religious groups; detention of activists; Hong Kong arrests (e.g. Jimmy Lai of Apple Daily, 2020); policing citizens abroad",39],["What is the United Front Work Department (UFWD)?","The CCP's main foreign influence arm, increasing China's influence abroad through community groups in the diaspora",41],["5 principles of Chinese foreign policy under Xi?","1) China was a victim of Western imperialism 2) China is returning to great power status 3) China must regain lost territory 4) Peaceful coexistence and non-interference 5) The West is trying to contain China's rise",42],["What is the Belt and Road Initiative (BRI)?","Xi's 2013 global infrastructure program (railways, ports, pipelines, highways) funded by Chinese loans, linking China with Asia, Europe, Africa, Oceania and Latin America",43],["Scale of the BRI?","147 countries; two-thirds of world population and ~40% of global GDP; $1–8 trillion spent 2013–2023",44],["China's motives for the BRI?","Develop Xinjiang and western China; secure energy supplies; gain leverage over other countries (e.g. not recognising Taiwan); expand influence",45],["Criticisms of the BRI?","Debt trap fears (debts can be called in); dependence on China; projects may serve Chinese military expansion; mainly serves China's interests",46],["BRI examples?","Addis Ababa–Djibouti railway (Ethiopia); Gwadar port, China–Pakistan Economic Corridor; Kenya's $3bn railway; railways in Indonesia",47],["Deng Xiaoping's foreign policy approach?","\"Keep a cool head and maintain a low profile. Never take the lead\": prioritise development, avoid disputes, build ties with the US",48],["Examples of China's more assertive foreign policy under Xi?","Artificial islands in the South China Sea (since 2014); clashes with the Philippines coast guard; Xi: Taiwan reunification \"inevitable\" (2019); 153-aircraft exercise near Taiwan (Oct 2024); India border clashes 2021–22",49],["What is \"wolf warrior\" diplomacy?","Aggressive, nationalist Chinese diplomacy: pushing back hard on criticism, storming out of meetings, insulting foreign officials; unpopular abroad but popular at home",50],["Russia vs China political systems: similarities?","Both centralise power in one lifelong leader (Putin, Xi), ban protests, censor media and the internet, and pursue critics overseas",51],["Russia vs China: key differences?","China is openly one-party; Russia claims multi-party democracy that Putin controls. China is a manufacturing giant tied to world markets; Russia relies on oil and gas exports. Russia's foreign policy is more openly anti-Western",52]],"exam":[{"t":"Explain","m":4,"q":"Explain why Taiwan is a flashpoint between China and the West.","g":"The One China Principle and the PRC claim; Taiwan's de facto independence; US strategic ambiguity and arms sales; strategic location and semiconductors. Link these to the risk of conflict."},{"t":"Explain","m":6,"q":"Explain how Xi Jinping has concentrated power since 2013.","g":"Holds three top posts (General Secretary, President, Military Commission chair); anti-corruption purges; removal of presidential term limits (2018); Xi Jinping Thought in the constitution; tighter control (Great Firewall, social credit). Show how each concentrates power."},{"t":"Evaluate","m":6,"q":"Evaluate the Belt and Road Initiative as a tool of Chinese foreign policy.","g":"Aims and scale; successes (infrastructure, trade, influence, examples); criticisms (debt-trap concerns such as Hambantota, corruption, environmental harm, backlash). A judgement on its effectiveness for China."},{"t":"Compare","m":4,"q":"Compare the political systems of Russia and China.","g":"Similarities (authoritarian, dominant leader, repression, censorship) and differences (China a one-party Leninist state with CCP meritocracy vs Russia's personalist rule with managed multi-party elections). State the significance."}]},{"subject":"Global Politics","name":"European Union","boss":"The Bureaucrat Queen","art":4,"cards":[["What is the European Union?","An economic and political union of 27 sovereign states; not a state itself, so members keep their own institutions, courts, militaries and laws",0],["EU: population and GDP?","About 449 million people (3rd largest if one state); about $20 trillion GDP (16% of world GDP)",1],["EU: average GDP per capita, HDI, Gini?","About $45,000; HDI 0.903; Gini 29.6, with big variations between members",2],["Why did Europeans unite after WW2? (4 reasons)","To rebuild war-destroyed economies; to prevent a third war by binding economies together; to settle disputes through shared institutions; to build a common identity that weakens extreme nationalism",4],["What was the ECSC?","European Coal and Steel Community (1951 Treaty of Paris, in force 1952): pooled coal and steel with no tariffs and a binding High Authority, making war \"materially impossible\"",5],["What was the Schuman Declaration (1950)?","Robert Schuman's plan for the ECSC: pool coal and steel under a High Authority to end France–Germany antagonism and lay the groundwork for European federation and peace",7],["What did the Treaty of Rome (1957) create?","The European Economic Community (EEC): a common market with no internal tariffs and aligned trade, agriculture and transport policies",8],["What did the Maastricht Treaty (1992) do?","Created the European Union, with EU citizenship, deeper economic and political union, and a common foreign and security policy",11],["What are the \"four freedoms\" of the single market?","Free movement of goods, people, services and capital",12],["When was the euro adopted?","1999, by 11 countries (now about 20 use it)",13],["What is the Schengen Area?","The EU's passport-free travel zone (the UK never joined)",14],["Eastern expansion of the EU?","From 2004, formerly communist states joined (e.g. Poland, Hungary, Czechia, the Baltic states, Romania, Bulgaria, Croatia), 13 new members by 2013–15",15],["Why was eastern expansion difficult?","New members were much poorer and lacked strong democratic traditions and institutions",16],["Countries applying to join the EU?","Albania, Bosnia, Georgia, Moldova, North Macedonia, Serbia, Turkey, Ukraine",17],["Unitary state?","Power concentrated in the national government; regions just implement national laws (most states)",18],["Federation?","Power shared between national and regional governments, each with its own laws and courts (e.g. USA, Australia)",19],["Confederation?","A loose union where regional governments hold most power and can veto national decisions (e.g. the 13 American colonies); the EU is sometimes described this way",20],["Benefits of EU membership (CFR, 2023)?","The average citizen is €840 a year richer from the single market; the euro boosts tourism and cheap borrowing; more bargaining power in trade deals",21],["Criticisms of the EU (CFR, 2023)?","Brussels as an overbearing \"nanny state\" eroding sovereignty; Greece angry at budget demands; Hungary rejecting migration quotas; Poland dismissing criticism over its courts",22],["European Council: who and what?","Heads of state or government of the 27 members, meeting at least 4 times a year; sets the EU's direction and priorities by consensus",23],["European Parliament: who and what?","720 MEPs directly elected by citizens, seats by population (Germany 96, Luxembourg 6); grouped by ideology; adopts laws and the budget with the Council of the EU",24],["Council of the European Union: who and what?","Ministers from each member state; with Parliament adopts laws and the budget; coordinates foreign policy and concludes international agreements",25],["European Commission: who and what?","The EU's executive: 27 commissioners (one per state) who propose laws, allocate funds, enforce EU law and implement decisions; must not hold national political roles",26],["Which EU bodies form its legislature?","The European Parliament and the Council of the European Union together (with the European Council setting the agenda)",27],["Criticisms of the EU's political system?","Too complicated with nobody in charge; slow and bureaucratic (laws can take years); about €114m a year moving between Strasbourg and Brussels; MEPs can't initiate laws; seen as undemocratic and opaque",29],["Why did British Euroscepticism grow in the 2000s?","Resentment at funding poorer new members; Eastern European migration seen as taking jobs; fear of losing control to unelected EU bureaucrats",35],["Remain campaign arguments?","Prosperity (the EU bought 44% of UK exports); global standing as part of 500 million people; freedom to live, work and study across the EU",37],["Leave campaign arguments?","Sovereignty (EU law overrides UK law); uncontrolled EU immigration; cost (about £13 billion a year to the EU)",38],["Brexit referendum result?","Leave won 51.9% to 48.1% on about 72% turnout; young voters mostly Remain, older voters mostly Leave",39],["Economic impacts of Brexit on the UK?","GDP about 2.5–3% lower; exports to the EU down as much as 30% from border checks; new trade deals haven't made up the loss",41],["Other impacts of Brexit?","Free movement ended, but total immigration rose with non-EU workers; UK makes its own laws; harder travel; savings in EU fees wiped out by a weaker economy; rejoined the Horizon research scheme in 2023",42],["Brexit's impact on the EU?","Lost about 5% of its budget, with smaller economic impact than on the UK; emboldened Eurosceptics (AfD 20% in 2025; Poland and Hungary blocking refugee policy)",43],["Does the EU have its own army or UN vote?","No; members keep their own foreign policies and militaries, and the EU can't vote in the UN General Assembly",44],["What is the EU's Common Foreign and Security Policy (CFSP)?","Shared foreign policy guidelines: the European Council sets goals, the Council of the EU implements them, and the European External Action Service handles diplomacy",45],["Four goals of the CFSP?","Safeguard common EU values and interests; strengthen international security (sanctions, interventions); promote international cooperation (climate, terrorism, refugees); promote democracy, rule of law and human rights",46],["US vs EU foreign policy: similarities?","Both are broadly interventionist and promote democracy, human rights and international security through economic and military means",47],["US vs EU foreign policy: differences?","The EU works mainly through diplomacy, aid, sanctions and multilateral forums; the US is far more willing to use military force",48],["What is NATO?","A transatlantic collective security alliance founded in 1949, now 32 members, headquartered in Brussels",49],["What does Article 5 of NATO say?","An armed attack on one member is an attack on all; each will assist, including with armed force if needed",50],["Why was NATO created?","To deter Soviet aggression in the Cold War; US troops in Europe guaranteed US involvement and integrated European militaries",51],["EU members not in NATO?","Austria, Ireland, Cyprus and Malta",52],["Why do states want to join NATO?","Collective security guarantees, especially against a perceived Russian threat (e.g. Eastern Europe, Ukraine)",53],["EU humanitarian aid figures?","The world's biggest donor, about €95.9 billion a year combined (2023), in over 110 countries; Ukraine is the largest single recipient",54]],"exam":[{"t":"Explain","m":6,"q":"Explain why European states integrated after World War Two.","g":"Preventing another war (Franco-German reconciliation, the ECSC, the Schuman Declaration), economic recovery, containment of the USSR, collective strength. Trace the development (Treaty of Rome 1957, Maastricht 1992) and link causes to integration."},{"t":"Analyse","m":6,"q":"Analyse the causes and consequences of Brexit.","g":"Identify the causes (Euroscepticism, migration, sovereignty, the Leave campaign) and consequences (UK economy, trade, Northern Ireland, the EU's position); relate them to each other and draw out implications for the EU and UK."},{"t":"Describe","m":4,"q":"Describe the institutions of the European Union.","g":"European Council (heads of government, sets direction), European Commission (proposes laws, executive), European Parliament (elected, co-legislates), Council of the EU (ministers, co-legislates). Accurate roles."},{"t":"Compare","m":4,"q":"Compare the foreign policy approaches of the USA and the EU.","g":"Similarities (democracy, human rights, NATO cooperation) and differences (US hard power and global military reach vs EU soft power, CFSP consensus, no army or UN vote). Significance of the differences."}]},{"subject":"Global Politics","name":"Ukraine: Causes","boss":"The Iron Invader","art":5,"cards":[["Ukraine: GDP per capita, HDI, Gini?","About $5,069 per capita; HDI 0.734 (high, 100th of 193); Gini 36.1, so a developing nation",1],["Languages in Ukraine?","Ukrainian is official; Russian was official until 1991, and most Ukrainians are bilingual; Russian speakers are concentrated in the urbanised, industrial east and south",4],["Why do some Ukrainians speak Russian natively but not identify as Russian?","Centuries of Russification and Soviet-era migration spread the language, but national identity is based on citizenship, history and choice, not language",5],["What was Russification?","Tsarist (and later Soviet) policy suppressing Ukrainian language and culture in favour of Russian, e.g. the 1876 ban on Ukrainian-language books",10],["What was the Holodomor?","Stalin's man-made famine of 1932–33 caused by forced collectivisation; about 4 million deaths, 83% of them ethnic Ukrainians",14],["Soviet industrialisation in Ukraine?","Industrial output quadrupled by 1939; the Donbas became an industrial hub on its coal fields, drawing hundreds of thousands of Russian workers east",15],["How did Ukraine's borders change after WW2?","Parts of Poland, Romania and Slovakia, plus Crimea (1954), were added, forming today's internationally recognised borders",17],["How did glasnost revive Ukrainian nationalism?","Less censorship exposed Stalin's atrocities, revived Cossack history and the Ukrainian language, split the church from Moscow, and led to independence protests by 1989",19],["When did Ukraine declare independence from the USSR?","24 August 1991; confirmed by a 1 December 1991 referendum with 90% in favour on 84% turnout",20],["Problems facing Ukraine in the 1990s?","Hyperinflation (over 4,700% in 1993); GDP fell by over 60%; oligarchs bought state firms; crime and poverty rose and life expectancy fell",21],["What was the Budapest Memorandum (1994)?","Ukraine gave up about 1,900 Soviet nuclear weapons in exchange for assurances from Russia, the US and UK not to use force against it",23],["What was the Orange Revolution?","Mass protests after the fraudulent 2004 election declared pro-Russian Yanukovych the winner over pro-Western Yushchenko (who had been poisoned with dioxin); a rerun made Yushchenko president",25],["Yushchenko's presidency (2005–10)?","Aimed for EU talks and NATO membership; free market reforms; undermined by a feud with PM Yulia Tymoshenko; approval fell to 3%",26],["How did Yanukovych reorient Ukraine after 2010?","Abandoned NATO membership; extended Russia's Sevastopol naval lease to 2042; jailed Tymoshenko",27],["Why did Yanukovych reject the EU Association Agreement (Nov 2013)?","Russian pressure (tariffs, gas prices, threats) plus a Russian offer of a $15bn bailout and cheaper gas, and the EU's refusal to give the $160bn he wanted",28],["What were the Euromaidan protests?","Protests in Kyiv's Independence Square from 21 Nov 2013 against abandoning the EU deal; up to 400,000 people; violence killed about 108 protesters and 13 police",29],["What was the Revolution of Dignity?","The 2014 culmination of Euromaidan: Yanukovych fled to Russia and parliament (73%) removed him in Feb 2014; Russia called it an illegal coup",30],["How did Russia annex Crimea (2014)?","Unmarked Russian special forces (\"little green men\") seized Sevastopol; a probably rigged referendum claimed 96% for joining Russia; annexed 21 March 2014",31],["What are the DPR and LPR?","The Donetsk and Luhansk \"People's Republics\", declared by Russian-backed separatists in the Donbas in 2014",32],["What was the Donbas War (2014–22)?","Fighting between Ukraine and Russian-backed separatists; Russia covertly sent troops and weapons; stalemate and trench warfare after 2015",33],["What was MH17?","A civilian airliner shot down over the Donbas by a Russian missile on 17 July 2014, killing 298 people",34],["What were the Minsk agreements?","Two 2014–15 ceasefire deals that set a line of contact and buffer zone but failed to stop the fighting",35],["Who was Petro Poroshenko?","Pro-Western billionaire president from 2014; signed the EU Association Agreement, pursued NATO, removed Soviet monuments; lost popularity over the war, the economy and corruption",36],["How did Zelenskyy win in 2019?","As an anti-corruption political outsider (famous for playing the president in \"Servant of the People\"); campaigned on social media, not debates; won about 75%",37],["Why has Zelenskyy been an effective leader?","Huge mandate across Ukraine including Russian speakers; communicates fluently in Ukrainian, Russian and English; authentic, humble persona; stayed in Kyiv (\"I need ammunition, not a ride\")",38],["Russia's 2021 military buildup?","About 87,000 troops on the border by April 2021, reaching about 100,000 surrounding Ukraine from Russia, Crimea and Belarus by Nov 2021",40],["Possible reasons for Russia's 2021 buildup?","Response to NATO exercises; claims Ukraine planned to attack the Donbas; Zelenskyy banning pro-Russian TV and parties; warning Biden not to back Ukraine's NATO bid",41],["Why was the 2021 buildup counterproductive (Bieliesko)?","The more Russia threatened, the more Ukraine wanted NATO; Zelenskyy shifted from ambiguity to full support for NATO",42],["Russia's December 2021 ultimatum to NATO?","No NATO enlargement (especially Ukraine); no forces in states that joined after 1997; remove intermediate-range missiles; no military activity in Ukraine, Eastern Europe, Caucasus or Central Asia",43],["NATO's response to the ultimatum (Jan 2022)?","Rejected it: any country may apply and Ukraine is sovereign; demanded Russia withdraw from Ukr
