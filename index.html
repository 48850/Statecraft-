aine, Georgia and Moldova; the US sent 3,000+ troops to Germany, Poland and Romania",44],["Why is the ultimatum seen as a pretext for war?","Russia knew NATO would refuse; it bought time to mobilise and let Russia claim it tried diplomacy and that NATO was the aggressor",45],["Putin's claims in his 21 Feb 2022 address?","Ukraine was always part of Russia; its government is illegitimate, neo-Nazi and a US puppet; Euromaidan was a coup; NATO planned to attack Russia; Ukraine planned \"genocide\" of Russian speakers; he recognised the DPR and LPR",46],["How did Putin justify the 24 Feb 2022 \"Special Military Operation\"?","Claimed the Donbas republics requested help and invoked UN Charter Article 51 (self-defence); but Russia wasn't attacked and the republics aren't UN members",47],["Russia's war aims at the start of the invasion?","Remove the Zelenskyy government (\"denazify\", \"demilitarise\"); annex more land (Donetsk, Luhansk, Zaporizhzhia, Kherson) and a land bridge to Crimea; block NATO and EU membership; reassert great power control over the Near Abroad",48],["Why did Russia think only full invasion would work (Socor)?","Ukraine was moving away from Russia: reversing Russification, banning pro-Russian media and prosecuting Moscow's allies (e.g. Medvedchuk), leaving no faction to manipulate",49],["Ukraine's war aims?","Defend its sovereignty and democracy; regain all occupied territory including Crimea and the Donbas; secure its future by joining NATO and the EU",50],["How has Ukrainian public opinion on territorial compromise changed?","Opposition to any concessions fell from about 82% to 50% and openness to compromise rose from 10% to 39%, driven by war fatigue",51],["The West's war aims?","Support Ukraine's independence and right to choose alliances; avoid escalation to a direct NATO–Russia (nuclear) war; uphold sovereignty and international law to deter others (e.g. China and Taiwan)",52],["Russia's initial invasion plan?","Attack from north (via Belarus), east and south; decapitate the government and install a pro-Russian one within about 10 days",53],["Why did the initial Russian invasion fail? (Jones, 2022)","Logistics collapse (no food or fuel, unprotected supply lines, rail dependence, broken vehicles); false assumptions (quick collapse, passive civilians, weak army); poorly timed cyberattacks; no plan B",56],["What kind of war did it become after 2022?","A war of attrition and industrial endurance: high stakes for both sides, sustained by Western weapons",58],["Main causes of the 2022 war (summary)?","Ukraine's turn to the EU and NATO; the Orange Revolution and Euromaidan; Crimea and the Donbas war; Zelenskyy's election and pro-Western shift; Russia's mobilisation and ultimatum",59]],"exam":[{"t":"Explain","m":6,"q":"Explain the historical causes of tension between Russia and Ukraine.","g":"Russification, the Holodomor, Soviet border changes, independence (1991), the Budapest Memorandum, the Orange Revolution, Yanukovych and Euromaidan, the annexation of Crimea (2014) and the Donbas war. Link each to the deterioration in relations."},{"t":"Evaluate","m":10,"q":"'Russia invaded Ukraine in 2022 to prevent NATO expansion.' To what extent do you agree?","g":"A judgement. NATO argument: the December 2021 ultimatum, Putin's claims. Counter: the ultimatum as a pretext, imperial and identity aims (Putin's 21 February address denying Ukrainian statehood), regime security, Ukraine's democratic turn. Use evidence and historians, and weigh them."},{"t":"Explain","m":4,"q":"Explain why Russia's initial invasion plan in 2022 failed.","g":"The plan (rapid decapitation strike on Kyiv); failures (poor logistics, underestimating Ukrainian resistance, intelligence failures, Western aid, Zelenskyy staying in Kyiv); outcome (a war of attrition). Cause and effect."}]},{"subject":"Global Politics","name":"Ukraine: Response","boss":"The Veto Golem","art":6,"cards":[["What happened at the UN Security Council on 25 Feb 2022?","A US–Albania resolution demanding Russia stop the invasion failed due to Russia's veto (11 for, 1 against, 3 abstained: China, India, UAE)",0],["How did the UN get around Russia's veto?","UNSC Resolution 2623, a procedural vote that can't be vetoed, called an emergency special session of the General Assembly",1],["What was UNGA Resolution ES-11/1?","\"Aggression against Ukraine\" (2 March 2022): condemned the invasion as a breach of UN Charter Article 2(4) and demanded Russia withdraw immediately, completely and unconditionally",2],["Vote count on ES-11/1?","141 for, 5 against, 35 abstentions",3],["What does UN Charter Article 2(4) prohibit?","The threat or use of force against the territorial integrity or political independence of any state",4],["Is a UNGA resolution binding?","No; it shows the moral weight and consensus of the international community but can't be enforced",5],["Successes of international condemnation?","Eight UN resolutions against Russia since 2022; expelled from 42 international organisations (e.g. UN Human Rights Council, Council of Europe, OECD); reduced influence and isolation; athletes compete as neutrals",6],["Failings of international condemnation?","Non-binding, so it didn't stop the war; the UNSC was paralysed by Russia's veto; many states abstained, especially in Africa and Asia",7],["How did African states vote on ES-11/1?","Split: 28 for, 1 against (Eritrea), 17 abstained, 8 didn't vote",8],["Why did some African states abstain or oppose ES-11/1? (Ryder and Kebret)","Long-standing economic, military and political ties with Russia; Cold War non-alignment and neutrality; objections to the resolution's wording and how it was negotiated",9],["What should the West learn from the African response?","Africa isn't a bloc that automatically follows the West; Western states must listen to African concerns and engage more fairly",10],["How does the US impose sanctions?","Through the Treasury's Office of Foreign Assets Control (OFAC); sanctions on over 12,000 people and entities",11],["How does the EU impose sanctions?","They require unanimous consent in the Council of the EU; seen as the EU's most powerful foreign policy tool since it has no army; second-largest non-UN issuer after the US",12],["Why is UN sanctions enforcement often weak?","Sanctions need UNSC approval (veto risk) and rely on member states to enforce them",13],["Scale of Western sanctions on Russia?","More than 16,500 sanctions since Feb 2022 by the US, UK, EU, Canada, Japan, Australia and others",14],["Aims of Western sanctions?","Punish Russia for violating Ukraine's sovereignty and reduce its ability to fund and fight the war",15],["Main types of sanctions on Russia?","About $350bn of central bank reserves frozen; 70% of bank assets and about $20bn of oligarch assets frozen; banks cut from SWIFT; a $60 oil price cap; US and UK oil and gas bans; airspace bans; technology export bans; companies like McDonald's leaving",16],["What is SWIFT?","The international bank messaging system for instant cross-border transfers; some Russian banks were excluded",17],["Successes of sanctions?","GDP fell 2.1% in 2022; the economy is about 20% smaller than it would have been; over $500bn in lost revenue; inflation 10% and interest rates 21% by Feb 2025; 15% of aircraft grounded; oligarchs' assets and travel restricted",18],["How has Russia circumvented sanctions?","Trade with non-Western states (China trade +127%, India +55%, 2021–24); discounted oil sales to Asia and Africa; sourcing technology via China and third countries; a $10bn+ \"shadow fleet\" of tankers hiding oil's origin",19],["Why haven't sanctions crippled Russia (CFR, 2024)?","It built $640bn in reserves before the war (only half frozen); trades in roubles and yuan (90% of China trade); a war economy; China supplies dual-use technology",20],["Total Western aid to Ukraine?","More than $250 billion (military, financial and humanitarian)",21],["Who provides aid to Ukraine?","USA about 43% ($120bn); EU collectively about 50%; rest of the world about 7%; the EU has committed another €115bn",22],["Examples of Western military aid?","80+ rocket systems (e.g. HIMARS), 500 field guns, 300+ tanks, F-16 jets, air defence systems, and US intelligence for targeting",23],["Western financial aid to Ukraine?","Budget support that keeps government running (salaries, pensions, repairs), about 25% of Ukraine's budget each year; the EU removed tariffs and opened grain corridors",24],["Humanitarian aid to Ukraine?","Over $19bn from 42+ states and donors, largely through UN agencies and NGOs; Europe hosts about 7 million Ukrainian refugees",25],["Positive impacts of aid to Ukraine?","Levelled the field against a bigger Russia with superior weapons and intelligence; prevented economic collapse despite $40bn+ annual deficits; boosted morale; without US aid Ukraine would probably have lost",26],["How does the US benefit from aid to Ukraine (Sonnenfeld and Tian, 2024)?","About 90% of aid money is spent in the US on defence manufacturing (jobs in 38+ states); Russia's military degraded with no US casualties for about 5% of the defence budget; NATO allies spending more on defence",27],["Drawbacks of aid to Ukraine?","Conditions (no strikes inside Russia until May 2024); weapons needing long training; too slow and too little (e.g. F-16s delayed, $61bn package held up by Republicans 2023–24); may encourage Ukraine to refuse compromise and prolong the war",28],["Major and Puglierin's (2024) view of Western aid?","Without it Ukraine wouldn't exist, but it came too late, after long debates and in insufficient numbers, risking a peace on Russian terms",29],["What is the International Criminal Court (ICC)?","A permanent court (2002) that prosecutes individuals for genocide, war crimes, crimes against humanity and aggression",30],["ICC vs ICJ?","The ICC prosecutes individuals for international crimes; the ICJ settles disputes between states",31],["What is the Rome Statute?","The treaty creating the ICC; 125 states have ratified it and must cooperate, including arresting indicted people on their territory",32],["Three ways a case reaches the ICC?","A member state refers a crime on its territory; the UNSC refers a situation; the prosecutor opens an investigation on their own initiative",33],["Key ICC weakness?","No police force: it relies entirely on member states to arrest suspects, and can't try people in absentia",34],["Which major states are not ICC members?","Russia, China and the US (which signed but never ratified, fearing politicised prosecutions of its soldiers)",35],["When did Ukraine join the ICC?","Ratified in 2022, a member from early 2024; it first asked the ICC to investigate in 2015",36],["ICC record so far?","Over 50 people indicted in 31 cases: 21 detained, 10 convicted, 4 acquitted",37],["Why was Putin indicted by the ICC (17 March 2023)?","For the unlawful deportation and transfer of Ukrainian children to Russia, alongside Maria Lvova-Belova (Children's Rights Commissioner); a war crime under the Geneva Conventions",38],["Evidence against Putin in the ICC case?","Hundreds of children taken from orphanages and care homes and adopted in Russia; Putin's decrees fast-tracking Russian citizenship to make adoptions easier, showing intent to remove them permanently",39],["Which Russian generals were indicted (2024)?","Viktor Sokolov, Sergey Kobylash, Sergei Shoigu and Valery Gerasimov, for attacks on civilian targets (energy infrastructure)",40],["Successes of the ICC warrant against Putin?","Restricts his travel: attended the 2023 BRICS summit in South Africa remotely and skipped the 2024 G20 in Brazil; validates war crime accusations through an independent investigation; further isolates Russia",41],["Failings of the ICC warrant?","Russia doesn't recognise the court; Putin is unlikely to be arrested while he avoids cooperative states; Mongolia, an ICC member, welcomed him in Sept 2024",42],["Why did Mongolia not arrest Putin?","Landlocked and dependent on Russia for nearly all its fuel and about 20% of its electricity; national survival came before legal obligation (visit marked 85 years since Khalkhin Gol)",43],["Republican vs Democrat support for Ukraine?","About 30% of Republicans versus 62% of Democrats support it",44],["Trump's 2024 campaign claims on Ukraine?","The war \"would have never happened if I was president\"; he'd end it \"within 24 hours\"; Europe should carry more of the burden",45],["Trump's 2025 claims about Zelenskyy, and the rebuttals?","Called him a \"dictator\" for not holding elections (but Ukrainian law suspends elections under martial law); blamed Ukraine's NATO ambitions for the war (but Russia's territorial claims and denial of Ukraine's statehood drove it)",46],["Timeline of Trump's 2025 peace efforts?","12 Feb call with Putin; 18 Feb US–Russia talks in Riyadh without Ukraine; 28 Feb White House clash, Zelenskyy sent away without signing the minerals deal; aid and intelligence paused 3–5 March; Ukraine accepted a 30-day ceasefire 11 March; Russia refused and kept attacking",47],["What was the US–Ukraine minerals deal proposal?","US companies to gain control over 50% of Ukraine's rare earth deposits, framed as \"repayment\" for US aid",48],["What does Russia get under Trump's April 2025 peace proposal?","De jure US recognition of Crimea; de facto control of occupied Luhansk, Donetsk, Kherson and Zaporizhzhia; no NATO for Ukraine; sanctions lifted; US economic cooperation",49],["What does Ukraine get under Trump's peace proposal?","A vague \"robust security guarantee\" (European peacekeepers, no US role); occupied Kharkiv land back; free passage on the Dnieper; possible EU membership; unfunded reconstruction",50],["Evaluation of Trump's peace plan?","Would halt fighting and allow EU membership, but rewards aggression, has vague, unfunded guarantees, and largely matches Russia's war aims",51],["Evidence Putin wasn't interested in peace in 2025 (Atlantic Council)?","Rejected the 30-day ceasefire, stepped up offensives, kept maximalist demands (four oblasts, demilitarisation)",52],["Why did Russia say the US position \"largely coincides with our vision\"?","The US stopped condemning Russia at the UN and sidelined Ukraine's goals of NATO and Western integration",53],["Overall evaluation of the international response to the invasion?","Partially effective: condemnation isolated Russia, sanctions weakened its economy, aid kept Ukraine fighting, and the ICC limited Putin's travel; but it couldn't end the war, because of the veto, sanctions evasion via non-Western states, delayed aid and national interests over law",54]],"exam":[{"t":"Evaluate","m":6,"q":"Evaluate the effectiveness of Western sanctions on Russia.","g":"Scale and aims; successes (SWIFT exclusions, frozen assets, technology limits); failures (circumvention through China, India and third countries, energy revenue, a war economy, CFR 2024). A judgement."},{"t":"Evaluate","m":6,"q":"Evaluate the effectiveness of the ICC's response to Russia's invasion of Ukraine.","g":"The 17 March 2023 warrant for Putin (child deportations), the 2024 indictments of generals; successes (travel restrictions, stigma, a historic precedent); failings (no enforcement, non-members, Mongolia not arresting Putin). A judgement."},{"t":"Explain","m":4,"q":"Explain how the UN responded to Russia's invasion despite Russia's veto.","g":"The 25 February 2022 UNSC veto; Uniting for Peace and an emergency UNGA session; Resolution ES-11/1 (141 for); non-binding nature; significance (condemnation, legitimacy, but no enforcement)."},{"t":"Evaluate","m":10,"q":"Evaluate the overall effectiveness of the international response to Russia's invasion of Ukraine.","g":"Consider the UN (condemnation without enforcement), sanctions (partial impact), aid (military, financial, humanitarian; the war sustained), the ICC (symbolic), and US policy shifts under Trump. Weigh them and reach an overall judgement with evidence."}]},{"subject":"History","name":"Origins: Europe","boss":"The Iron Curtain","art":2,"cards":[["What was the Cold War?","Ideological and geopolitical rivalry between the USA and USSR from the end of WW2 to the Soviet collapse in 1991, with no direct war between them","c1"],["Why was it called 'cold'?","The superpowers never fought each other directly; they competed through threats, propaganda, arms races and proxy wars","c2"],["Marxism?","Philosophy of Karl Marx and Friedrich Engels (19th century): history is shaped by class struggle, and workers will overthrow capitalism in a socialist revolution","c3"],["What caused Marx and Engels to develop Marxism?","The poor economic and social conditions of workers during the Industrial Revolution","c4"],["Bourgeoisie vs proletariat?","Bourgeoisie: the capitalist class that owns businesses and the means of production. Proletariat: the working class who sell their labour for wages and are exploited","c5"],["What would a communist society look like, according to Marx?","Classless; property communally owned; resources allocated by need, not profit; each contributes according to ability and receives according to need","c6"],["When and how was the USSR founded?","1922, after the Bolsheviks under Lenin seized power in the October Revolution (1917) and won the Russian Civil War (1917-22)","c7"],["Political features of the USSR?","One-party dictatorship: only the Communist Party allowed, no elections, decisions made by a small elite, heavy censorship, harsh punishments and secret police","c8"],["Economic features of the USSR?","Command economy: no private enterprise, all businesses state-owned and run by bureaucrats, resources allocated by need, prices fixed by the government","c9"],["How many republics made up the USSR, and which dominated?","15 Soviet Republics; Russia held 76% of the territory and over 50% of the population, and Russians dominated leadership","c10"],["How did Stalin treat religion?","Promoted atheism: churches closed and clergy imprisoned (800 higher clergy and 4000 priests in the Great Terror); by 1940 only 500 churches were open, 1% of the 1917 figure","c11"],["Nomenklatura?","The privileged elite of officials who ran the Soviet party and government","c12"],["Why was the wartime Grand Alliance uneasy?","It was an alliance of necessity against Nazi Germany: Britain and the USA feared communism, and Stalin distrusted the capitalist powers (Western intervention in the Russian Civil War, the delayed second front)","c13"],["How many Soviet deaths in WW2?","About 24 million, 13.9% of the population","c14"],["When and where was the Yalta Conference, and who attended?","4-11 February 1945 in Crimea: Stalin, Roosevelt and Churchill (the 'Big Three')","c15"],["What did each leader want at Yalta?","Stalin: a buffer zone in Eastern Europe. Churchill: to stop communism spreading into Eastern Europe. Roosevelt: Soviet help against Japan and a United Nations","c16"],["What was agreed at Yalta?","USSR to fight Japan after Germany's defeat; Germany split into zones (France included); free elections in Poland; Declaration on Liberated Europe; the UN set up with a Soviet veto","c17"],["Why did relations worsen between Yalta and Potsdam?","Roosevelt died (12 April 1945) and the strongly anti-communist Truman took over; Attlee replaced Churchill; Stalin broke Yalta promises in Eastern Europe; the USA tested the atomic bomb (16 July 1945)","c18"],["When was the Potsdam Conference, and who attended?","17 July-2 August 1945: Stalin, Truman, and Churchill, who was replaced by Attlee mid-conference","c19"],["Why was Potsdam more tense than Yalta?","Germany had surrendered, so the common enemy was gone; Truman was anti-communist; the USA had the bomb; Stalin was already imposing communism in Eastern Europe","c20"],["What was agreed at Potsdam?","Germany demilitarised and denazified; Germany, Berlin, Austria and Vienna each split into four zones; Nazi war criminals prosecuted; Germany's eastern border moved west; the Soviet-backed Polish government recognised","c21"],["Satellite state?","A country that is officially independent but controlled by another power; in Eastern Europe, one-party states run by 'Little Stalins' on Moscow's orders","c22"],["Why did Stalin want satellite states?","A buffer zone against invasion from the west (Russia had been invaded four times since 1900), trading and security partners, and an end to Soviet isolation","c23"],["Methods the USSR used to take control of Eastern Europe?","Co-opting local communist parties, rigged elections, coalition governments with communists in key posts, Red Army intimidation and arrests, censorship and propaganda ('salami tactics')","c24"],["How did the Soviets take control of Poland?","Let the Nazis crush the Warsaw Uprising (1944); arrested 16 Home Army leaders (1945); removed 400,000 voters from the roll; jailed 80,000 opposition members; rigged the 1947 election (80% pro-Soviet)","c25"],["The Iron Curtain speech?","Churchill, Fulton, Missouri, 5 March 1946: an 'Iron Curtain' from 'Stettin in the Baltic to Trieste in the Adriatic' cut Eastern Europe off under totalitarian 'police governments'","c26"],["Cominform?","Set up 22 September 1947 to coordinate European communist parties (including those of France and Italy) under Soviet ideology","c27"],["Containment?","The US policy of preventing communism spreading to new countries, through military, economic and political support for threatened nations","c28"],["Kennan's Long Telegram?","February 1946: argued the USSR saw itself at war with capitalism, needed an external enemy, and was 'highly sensitive to the logic of force' rather than reason","c29"],["Three crises behind the Truman Doctrine?","The Iran Crisis (1946: Soviet troops refused to leave); the Turkish Straits Crisis (August 1946: Soviet demands for bases); the Greek Civil War (Britain announced its withdrawal, 24 February 1947)","c30"],["The Truman Doctrine?","Truman to Congress, 12 March 1947: $400 million for Greece and Turkey, and a pledge to support free peoples resisting communism anywhere; the end of US isolationism","c31"],["Flawed assumptions of the Truman Doctrine?","That the USSR was behind all revolutions (many were anti-colonial), that it sought world domination (Stalin focused on his borders), and that it only responded to force","c32"],["Novikov Telegram?","September 1946: the Soviet ambassador argued that the USA sought world domination and that the USSR must keep expanding its influence to counter it","c33"],["Why did the USA create the Marshall Plan?","Destruction and poverty in Europe made communism attractive (strong communist parties in France and Italy), and the USA wanted European trade partners","c34"],["The Marshall Plan (European Recovery Program)?","April 1948: over $13 billion (about 5% of US GDP) in aid to 16 European nations, on condition of free-market reforms","c35"],["Impacts of the Marshall Plan?","Industrial production up 35% by 1952; communist parties sidelined in France and Italy; European integration (the ECSC, 1952); Western Europe bound to the USA","c36"],["How did Stalin respond to the Marshall Plan?","Called it 'dollar imperialism', forced Poland and Czechoslovakia to withdraw their applications, and created Comecon (1949) to tie Eastern Bloc economies to the USSR","c37"],["Aims of the occupation of Germany (the Four Ds)?","Demilitarisation, denazification, decentralisation, democratisation","c38"],["Bizonia?","January 1947: the American and British zones merged for economic and political cooperation (France joined in 1948, making Trizonia)","c39"],["Causes of the Berlin Blockade?","The Western powers built up a strong capitalist West Germany: Bizonia, the new Deutschmark (1948) and Marshall aid. Stalin saw this as breaking the Potsdam agreements","c40"],["The Berlin Blockade?","24 June 1948: Stalin cut all land and river routes to West Berlin, trapping 2 million people with 36 days of food, to force the West out","c41"],["The Berlin Airlift?","June 1948-September 1949: 2.3 million tons of supplies flown in, up to 13,000 tonnes a day, a plane landing every 45 seconds, costing $224 million","c42"],["Significance of the Berlin Blockade?","Stalin backed down (12 May 1949): a propaganda win for the West and proof that containment worked. Germany split into the FRG (May 1949) and GDR (October 1949), and the pattern of brinkmanship without direct war was set","c43"],["NATO?","Formed 4 April 1949 by 12 nations: a collective security alliance where an attack on one is an attack on all (Article 5). Its aim: 'keep the Soviet Union out, the Americans in, and the Germans down'","c44"],["The Warsaw Pact?","14 May 1955, a response to West Germany joining NATO: a collective security pact of the USSR and seven satellites, but run entirely by Moscow to control its satellites","c45"],["NATO vs Warsaw Pact in practice?","NATO: a genuine alliance of equals that decides by consensus. Warsaw Pact: a Soviet commander, Soviet-only decisions, Soviet weapons imposed, and Soviet troops in satellites","c46"],["Orthodox vs revisionist views on the start of the Cold War?","Orthodox (e.g. Schlesinger): Soviet expansionism caused it. Revisionist (e.g. William Appleman Williams): American economic expansionism and hostility caused it","c47"],["Why did the Cold War start, as a security dilemma?","Each side felt threatened, acted to defend itself, and the other side read those defensive moves as aggression and responded the same way","c48"]],"exam":[{"t":"Describe","m":6,"q":"Describe the key features of the Soviet Union under Stalin.","g":"One-party dictatorship (Communist Party only, no elections, censorship, secret police, purges); command economy (state ownership, no private enterprise, fixed prices); federation of 15 republics dominated by Russia; social controls (atheism, church closures, state-run education). Accurate detail and specific examples, e.g. 1% of churches open by 1940."},{"t":"Explain","m":6,"q":"Explain why relations between the Big Three worsened between the Yalta and Potsdam conferences.","g":"Must give causes and show how each damaged trust: Roosevelt's death and Truman's anti-communism; Attlee's inexperience; Stalin breaking Yalta promises in Poland and Eastern Europe; the secret US atomic test (16 July 1945) reducing US need for Soviet help. Link each cause to its effect on relations."},{"t":"Explain","m":6,"q":"Explain how the Soviet Union established satellite states in Eastern Europe.","g":"Methods with evidence: Red Army presence filling the power vacuum; co-opting communist parties and coalitions; rigged elections; intimidation and arrests. Polish case study: Warsaw Uprising, 16 Home Army leaders, 400,000 removed from the roll, 80% rigged vote. Explain the motive (buffer zone)."},{"t":"Explain","m":6,"q":"Explain why the Truman Doctrine was implemented.","g":"Kennan's Long Telegram and the belief that the USSR responds to force; Iran, Turkish Straits and Greek crises; Britain's withdrawal from Greece (February 1947); fear of a domino effect from Greece to Turkey; the shift from isolationism to containment ($400 million in aid, 12 March 1947)."},{"t":"Analyse","m":6,"q":"Analyse the impact of the Marshall Plan on the division of Europe.","g":"Must identify the components and the relationships between them: aid helped Western recovery (35% industrial growth) and sidelined communist parties; Stalin's rejection ('dollar imperialism') and Comecon tied the East to the USSR; the result was a deeper economic divide that reinforced the Iron Curtain. Show how the US action produced the Soviet reaction."},{"t":"Explain","m":6,"q":"Explain how the Berlin Blockade increased tensions between the USSR and the USA.","g":"Causes (Bizonia, the Deutschmark, Marshall aid seen as breaking Potsdam); the blockade (24 June 1948, 2 million trapped); the airlift (2.3 million tons) as a direct test of will; outcomes (FRG and GDR created, NATO formed, Berlin a flashpoint, the brinkmanship pattern established)."},{"t":"Compare","m":4,"q":"Compare NATO and the Warsaw Pact.","g":"Similarities: both collective security alliances requiring mutual defence. Differences, and their significance: NATO an alliance of equals deciding by consensus vs the Warsaw Pact run by Moscow with a Soviet commander, used to control satellites. The answer must state why the differences matter."},{"t":"Evaluate","m":10,"q":"'The Soviet Union was responsible for the start of the Cold War.' To what extent do you agree?","g":"A clear judgement in the thesis. One side: Soviet expansion (broken Yalta promises, satellite states, the Berlin Blockade, support for Asian communists). Other side: US actions (the secret atomic bomb, the Truman Doctrine's flawed assumptions, perceived encirclement, Novikov), and the security-dilemma view. Use evidence from Europe and Asia, refer to historians (Schlesinger, Williams), and weigh the two sides to reach a conclusion."}]},{"subject":"History","name":"Origins: Asia","boss":"The Dragon of the East","art":3,"cards":[["Why did the USA drop the atomic bombs on Japan?","To force a Japanese surrender without a costly invasion (Marshall estimated at least 250,000 casualties) and without Soviet help, and to warn the USSR","a1"],["Hiroshima and Nagasaki: dates?","Hiroshima 6 August 1945 (80,000 killed instantly); Nagasaki 9 August 1945, hours after the USSR declared war on Japan","a2"],["When did Japan surrender?","Hirohito announced unconditional surrender on 15 August 1945; the formal surrender was signed aboard the USS Missouri on 2 September 1945","a3"],["Why wasn't Japan divided like Germany?","It surrendered quickly before the Soviets could occupy the mainland, so the USA alone occupied it under General Douglas MacArthur (1945-52)","a4"],["Conditions in Japan after WW2?","Cities destroyed by bombing; starvation (rations of 1042 calories a day in early 1946); homelessness worsened by 6.1 million Japanese returning from the colonies","a5"],["Early occupation reforms in Japan (1945-47)?","Purge of wartime officials, the Tokyo war crimes trials, the 1947 constitution (Emperor no longer divine, rights guaranteed), Article 9 renouncing war, women's suffrage, unions, and plans to break up the zaibatsu","a6"],["Article 9?","The clause in Japan's 1947 constitution in which the Japanese people 'forever renounce war' as a means of settling international disputes","a7"],["The 'reverse course'?","From 1948 the USA shifted from democratising Japan to rebuilding it as an anti-communist bulwark: reforms abandoned, wartime officials returned, only 11 of 325 zaibatsu broken up, a 'Red Purge' of leftists","a8"],["San Francisco Peace Treaty and US-Japan Security Treaty?","1952: ended the occupation, with $25 million in reparations; the security treaty let the USA keep bases in Japan. The Self Defense Forces followed in 1954","a9"],["Japan's significance to the USA in the Cold War?","A staging point for US troops in East Asia (especially in Korea) and, by 1968, the world's second-largest economy and a key anti-communist ally","a10"],["Guomindang (GMD)?","The Chinese Nationalist Party led by Chiang Kai-shek, which ruled the Republic of China from Nanjing after 1927","a11"],["The Long March?","The Communist army's retreat north after the GMD destroyed the Jiangxi Soviet, ending in a new base at Yan'an; it built Mao's leadership","a12"],["CCP vs GMD during the Sino-Japanese War (1937-45)?","A united front, but the GMD (with US and British support) lost ground and was seen as corrupt, while the CCP fought the Japanese harder and became seen as the 'defenders of China'","a13"],["The Marshall Mission?","December 1945: Truman sent General Marshall to negotiate a ceasefire and a coalition government between the GMD and CCP. It failed, and full civil war broke out by the end of 1946","a14"],["Why did the Communists win the Chinese Civil War?","Mao's charismatic leadership, guerrilla tactics, and land reform that won peasant support; GMD corruption, low morale, commanders chosen for loyalty, and the loss of US aid","a15"],["When was the PRC proclaimed?","1 October 1949, by Mao Zedong; Chiang fled to Taiwan","a16"],["Significance of Communist victory in China?","The second major communist country, and the only one where communism wasn't imposed by the USSR; it reinforced Truman's containment and drew the USA deeper into Asia","a17"],["What happened to Taiwan?","It became the GMD's Republic of China: a one-party state until 1987, backed by US aid, holding China's UN Security Council seat until 1971","a18"],["Why did the USSR boycott the UN in 1950?","In protest that the PRC was denied China's Security Council seat (13 January-1 August 1950). This meant the USSR had no veto when the UN voted on Korea","a19"],["How was Korea divided?","Along the 38th parallel at the end of WW2: a Soviet zone in the north under Kim Il Sung, a US zone in the south under Syngman Rhee","a20"],["How did two Korean states form in 1948?","The USSR boycotted UN-ordered elections, so the South voted alone (May 1948, Rhee 92%). The ROK was proclaimed in August and the DPRK under Kim in September","a21"],["When did North Korea invade South Korea?","25 June 1950, with Stalin's permission: 266,000 men and 230 Soviet tanks vs 95,000 South Koreans with no tanks; Seoul fell on 27 June","a22"],["How did the UN respond to the invasion of South Korea?","The Security Council voted to defend South Korea (no Soviet veto because of the boycott); US troops under MacArthur were pushed back to the Pusan perimeter","a23"],["The Inchon landing?","15 September 1950: MacArthur's amphibious landing near Seoul behind North Korean lines; Seoul was retaken and the UN advanced to the 38th parallel","a24"],["Rollback?","MacArthur's aim of removing communism from North Korea and reuniting Korea under Rhee: UN forces crossed the 38th parallel (7 October 1950) and took Pyongyang (19 October)","a25"],["Why did China intervene in Korea?","Mao feared that the USA would invade China once UN forces reached the Yalu River; from 25 October 1950 hundreds of thousands of Chinese troops pushed the UN back","a26"],["Why did Truman sack MacArthur?","MacArthur wanted to attack China, possibly with nuclear weapons, and publicly criticised Truman. He was removed for insubordination on 6 April 1951","a27"],["How did the Korean War end?","Armistice signed 27 July 1953 after two years of stalemate; a demilitarised zone along the border; no peace treaty, so the Koreas are technically still at war","a28"],["Human cost of the Korean War?","About 4 million Koreans (two-thirds civilians), 1 million Chinese and 40,000 UN troops killed; Korea permanently divided","a29"],["Four phases of the Korean War?","1. DPRK invasion; 2. UN intervention and advance to the Yalu; 3. Chinese intervention; 4. stalemate and armistice","a30"],["Was containment successful in Asia by 1953?","Mixed: it succeeded in Japan and South Korea, but China fell to communism and rollback failed in North Korea, so Truman returned to containment","a31"]],"exam":[{"t":"Compare","m":6,"q":"Compare the post-war occupation of Japan with the occupation of Germany.","g":"Similarities: occupation by democratic powers, democratisation and demilitarisation, war crimes trials, new US-modelled constitutions. Differences: Japan was occupied by the USA alone and not divided; Japan's government stayed in control; the reverse course. Explain the significance of the differences (Japan as a single US bulwark vs a divided Germany) and give an overall judgement."},{"t":"Explain","m":6,"q":"Explain why the Chinese Communist Party won the Chinese Civil War.","g":"CCP strengths (Mao's leadership, guerrilla tactics, land reform, the patriotic reputation from fighting Japan) and GMD weaknesses (corruption, loyalty-based commanders, requisitions alienating peasants, loss of US aid). Link each factor to the outcome, with dates (Yan'an 1947, Beijing January 1949, PRC 1 October 1949)."},{"t":"Explain","m":4,"q":"Explain the impact of the Communist victory in China on the Cold War.","g":"Containment reinforced and US involvement in Asia deepened; the Taiwan/PRC recognition dispute; the Soviet UN boycott (which allowed the UN vote on Korea); a second major communist power. Show cause and effect."},{"t":"Outline","m":4,"q":"Outline the main phases of the Korean War.","g":"An overview of the four phases with key dates: invasion (25 June 1950) and the Pusan perimeter; Inchon (September 1950) and the advance to the Yalu; Chinese intervention (October 1950); stalemate and armistice (27 July 1953). Main features only, no deep explanation needed."},{"t":"Evaluate","m":10,"q":"To what extent were US actions to contain communism successful between 1945 and 1953?","g":"A judgement in the thesis. Europe: Truman Doctrine (Greece), Marshall Plan, Berlin Airlift, NATO, all broadly successful. Asia: Japan secured, South Korea held, but China lost and rollback failed in the North. Weigh successes against failures, use specific evidence, and reach a qualified conclusion."}]},{"subject":"History","name":"Rising Tensions","boss":"The Red Scare","art":1,"cards":[["When did the USSR test its first atomic bomb, and why did it shock the USA?","29 August 1949, years earlier than predicted and helped by spies; the US nuclear monopoly was over","t1"],["NSC-68?","A top-secret 1950 National Security Council report recommending a 'rapid build-up of political, economic, and military strength', espionage against communist states, more spending to root out spies, and propaganda to win public support","t2"],["Executive Order 9835?","21 March 1947: loyalty assessments for all federal employees; those seen as disloyal or open to blackmail (including people with debts, LGBTIQ+ people and leftists) were dismissed","t3"],["HUAC?","The House Un-American Activities Committee: subpoenaed suspected communists and jailed those who refused to answer or name others for contempt of Congress","t4"],["The Hollywood Ten?","Ten film-industry figures jailed for refusing to answer HUAC's questions; about 320 others, including Charlie Chaplin, were blacklisted","t5"],["McCarthyism?","Senator Joseph McCarthy's 1950-54 accusations of disloyalty based on hearsay, ruining reputations and careers; it ended when he questioned the loyalty of the army","t6"],["J. Edgar Hoover's role in the Red Scare?","FBI director who compiled files on suspected subversives through illegal wiretaps and infiltration, passing them to Congress and employers; groups like the NAACP were targeted","t7"],["The Red Scare?","Public hysteria about communist infiltration, fuelled by government propaganda, trials, and media (films, comics such as 'Is this Tomorrow?')","t8"],["Impacts of the Red Scare on American society?","More conservative politics, left-wing groups silenced, civil rights groups surveilled, constitutional rights suspended (the 1951 Supreme Court ruling limiting communists' free speech), and thousands falsely accused","t9"],["When did Stalin die, and who succeeded him?","5 March 1953. Beria was executed; Khrushchev then isolated Malenkov and replaced him as Premier in 1955","t10"],["De-Stalinisation?","Khrushchev's reversal of Stalin's repression: amnesty for 1.2 million prisoners (1953), Gulag closed (1960), censorship reduced, Stalingrad renamed Volgograd (1961)","t11"],["The Secret Speech?","February 1956, to the 20th Party Congress: Khrushchev condemned Stalin's personality cult and purges (not released in the USSR until 1989)","t12"],["The Virgin Lands campaign?","1953-63: hundreds of thousands of volunteers farmed 40 million hectares in Kazakhstan; successful at first, then yields fell due to poor soil and mismanagement","t13"],["Limits of Khrushchev's reforms?","The one-party state, appointed leaders, censorship and the ban on private enterprise remained; living standards stayed well below the West's","t14"],["Peaceful coexistence (foreign policy)?","Khrushchev rejected Stalin's view that war with capitalism was inevitable: the two systems would compete peacefully, and communism would win by showing it was superior","t15"],["The Hungarian Uprising?","23 October 1956: 200,000 protested in Budapest; Nagy announced Hungary would leave the Warsaw Pact (1 November); 150,000 Soviet troops and 6000 tanks crushed it (3 November). 2,500 Hungarians were killed and 200,000 became refugees","t16"],["Significance of the Hungarian Uprising?","The USSR would use force to keep its satellites, which undermined peaceful coexistence and its claims that communism was superior","t17"],["The Manhattan Project?","The US nuclear weapons program (1942-45): 130,000 workers, $2 billion; first test at Los Alamos on 16 July 1945","t18"],["Nuclear proliferation?","The growth in the number, size and destructive power of nuclear weapons, and in the number of states that have them","t19"],["Three drivers of proliferation in the Cold War?","Superpower stockpiles growing as each overestimated the other; more nuclear states (UK, France, China); technology (hydrogen bombs, ICBMs)","t20"],["Atomic vs thermonuclear weapons?","Atomic: fission, smaller and less destructive. Thermonuclear (hydrogen, mid-1950s): far more destructive yet light enough to fit on a missile warhead","t21"],["Mutually Assured Destruction (MAD)?","Both sides had second-strike capability, so any nuclear war would annihilate both; this deterred direct conflict","t22"],["Second-strike capability?","The ability to retaliate with nuclear weapons after being attacked, because weapons were spread across ICBMs, submarines and bombers","t23"],["Brinkmanship?","Pushing the enemy as close to war as possible without starting one, to force them to back down","t24"],["Why didn't MAD reduce tensions?","It created a climate of fear, encouraged brinkmanship and proxy wars, and raised the risk of accidental war (32 nuclear accidents since 1950)","t25"],["Sputnik I?","October 1957: the first artificial satellite, launched by the USSR on a modified R7 ICBM rocket; it orbited every 96 minutes","t26"],["Why did Sputnik alarm the West?","It was a Soviet propaganda win that made communism attractive to newly independent nations, and showed that Soviet rockets could deliver nuclear warheads to the USA","t27"],["The US response to Sputnik?","Explorer I (January 1958), NASA (April 1958), and the National Defense Education Act (September 1958) funding maths, science and languages","t28"],["Yuri Gagarin?","12 April 1961: the Soviet cosmonaut who became the first human in space (108 minutes in orbit)","t29"],["Kennedy's 1961 space goal?","Landing a man on the Moon and returning him safely 'before the decade is out'; it led to the Apollo program ($25 billion)","t30"],["Apollo 11?","July 1969: Armstrong and Aldrin landed on the Moon, achieving Kennedy's goal; Armstrong said 'one small step for man, one giant leap for mankind'","t31"],["Why did the Soviet space program fall behind?","Less money, other priorities, the death of chief engineer Korolyov (1966), the Soyuz 1 disaster (1967), and no working lunar lander","t32"],["Why were newly independent nations attracted to communism?","Distrust of European systems after colonial exploitation, Soviet anti-imperialist propaganda, and the USSR's rapid industrialisation as a model for development","t33"],["Proxy war?","A conflict in which the USA and USSR each back opposing sides for control of a country, instead of fighting each other directly","t34"],["The Domino Theory?","Mid-1950s (Eisenhower): if one country fell to communism, its neighbours would follow, so communism had to be stopped at the first opportunity","t35"],["Consequences of the Domino Theory?","US intervention in the developing world: CIA coups and assassinations, support for corrupt anti-communist dictators, and troops overseas (e.g. Vietnam)","t36"],["Why did the USA support Batista?","He was anti-communist and protected US business interests (90% of mines, 80% of utilities), so the USA ignored his corruption, torture and Mafia links","t37"]],"exam":[{"t":"Explain","m":6,"q":"Explain the causes and impacts of the Red Scare in the USA.","g":"Causes: the Soviet A-bomb (1949), spy discoveries, China falling to communism, NSC-68's call for propaganda. Mechanisms: EO 9835, HUAC and the Hollywood Ten, McCarthy, Hoover's FBI. Impacts: civil liberties suspended, conservative politics, left-wing and civil rights groups silenced, false accusations. Link causes to impacts."},{"t":"Evaluate","m":10,"q":"Evaluate the extent to which Stalin's death resulted in change within the Soviet Union.","g":"Change: de-Stalinisation (amnesty, Gulag closure, Secret Speech), reduced censorship, peaceful coexistence, consumer goods. Continuity: one-party rule, appointed leaders complicit in Stalinism, censorship reduced not removed, the Hungary crackdown showing control by force. A judgement weighing the extent of change."},{"t":"Define","m":2,"q":"Define the term mutually assured destruction (MAD).","g":"A precise meaning: both superpowers had enough nuclear weapons and second-strike capability that any nuclear attack would lead to the annihilation of both sides, so neither would start a war. Essential qualities: second strike, mutual annihilation, deterrence."},{"t":"Explain","m":6,"q":"Explain how the nuclear arms race increased Cold War tensions.","g":"Proliferation trends (stockpiles, new nuclear states, H-bombs and ICBMs); MAD and the climate of fear; brinkmanship as a tactic; accident risk; competition through proxy wars. Show how each mechanism raised tension."},{"t":"Explain","m":4,"q":"Explain the significance of Sputnik for the space race.","g":"Sputnik as a Soviet propaganda victory and a military threat (ICBM capability); US fears of falling behind; the US response (NASA, NDEA, Explorer). Show cause and effect."},{"t":"Analyse","m":6,"q":"Analyse how the Domino Theory shaped US policy in the developing world.","g":"Identify the theory's logic (one fall triggers others, so stop it early); relate it to decolonisation and communism's appeal; draw out the implications: support for despots like Batista, CIA interventions, troops overseas leading to Vietnam. Show the relationships between theory, context and actions."}]},{"subject":"History","name":"Cuba & Berlin","boss":"The Missile Baron","art":2,"cards":[["Why was Batista's regime in Cuba resented?","It was corrupt, came to power by coup, and was propped up by the USA; American businesses and the Mafia dominated the economy","k1"],["Moncada Barracks attack?","26 July 1953: Castro's 70 revolutionaries attacked the barracks in Santiago and were easily defeated; Castro was jailed but used his two-hour trial speech to publicise his movement","k2"],["The 26th of July Movement?","The revolutionary group Fidel Castro and Che Guevara formed in exile in Mexico; they landed in Cuba aboard the Granma in November 1956","k3"],["How did Castro's guerrillas defeat Batista?","A guerrilla campaign from the mountains; Batista's crackdown alienated Cubans; the USA withdrew aid in March 1958; Guevara's 340 guerrillas beat 3900 soldiers at Santa Clara (December 1958)","k4"],["When did Castro take power?","Batista fled after Santa Clara; Castro arrived in Havana on 9 January 1959 and led a provisional government","k5"],["How did Castro consolidate power?","Executed about 500 Batista supporters, pushed non-communists out by 1960, set up Committees for the Defense of the Revolution (1961) to identify opponents","k6"],["Castro's socialist reforms?","Land reform breaking up large farms (1959); nationalisation; investment in health and education (illiteracy down from 22% in 1959 to 6% in 1980)","k7"],["How reliant was Cuba on the USA before 1959?","90% of its sugar and tobacco exports went to the USA; US firms controlled most natural resources; the USA supplied medicines, machinery and arms","k8"],["Why did US-Cuba relations break down?","Non-communists removed, ties with the USSR grew, tariffs on US goods, exile stories of repression, and domino fears. Castro nationalised 600 US companies worth $1.8 billion (1960) and the USA imposed an embargo (lasting until 2016)","k9"],["Why was West Berlin a problem for the USSR?","A capitalist showcase behind the Iron Curtain with higher living standards, an easy escape route causing a brain drain of skilled East Germans, and a base for Western spies","k10"],["East German uprising, 1953?","Workers protested and revolted against raised work quotas and poor living conditions; it was crushed","k11"],["Khrushchev's Berlin Ultimatum?","November 1958: demanded the West leave Berlin within six months and make it a demilitarised 'Free City', accusing the West of using it to subvert East Germany","k12"],["How did Eisenhower respond to the Berlin Ultimatum?","Refused to withdraw but agreed to talks (Geneva, May 1959; Camp David, September 1959); relations improved and a Paris summit was planned for May 1960","k13"],["Peaceful coexistence?","Khrushchev's policy of competing with the West without war and reducing tensions, driven partly by the threat of MAD","k14"],["The U2 incident?","1 May 1960: a CIA U2 spy plane flown by Francis Gary Powers was shot down over the USSR; the USA's 'weather plane' cover story was exposed by the wreckage and film","k15"],["Impact of the U2 incident?","Eisenhower refused to apologise or stop the flights, so the Soviets walked out of the Paris Summit; a chance to reduce tensions (Berlin, a test ban) was lost","k16"],["Why did Khrushchev reissue the Berlin ultimatum in June 1961?","He thought he could dominate the young, inexperienced Kennedy and used the U2 spying to justify action; refugees were pouring out (2,400 on 12 August alone)","k17"],["When was the Berlin Wall built?","12-13 August 1961: East German troops sealed the border with barbed wire overnight, replaced by a concrete wall from 20 August","k18"],["How did the GDR justify the Wall?","Called it the 'anti-fascist protective rampart', claiming it stopped Western spies and West Berliners buying subsidised Eastern goods","k19"],["The death strip?","The roughly 150m zone between the two walls (155km long by 1975): trenches, tank traps, electric fences and 302 watchtowers. At least 100 people were killed escaping","k20"],["Kennedy's response to the Wall?","Avoided confrontation but showed solidarity: sent LBJ and General Clay, plus 1500 more troops, and called up 148,000 reservists. 'A wall is a hell of a lot better than a war'","k21"],["The Checkpoint Charlie standoff?","27 October 1961: after East German guards blocked US diplomats, 10 US tanks faced 33 Soviet tanks for 18 hours, until both withdrew after direct Kennedy-Khrushchev talks","k22"],["Kennedy's 'Ich bin ein Berliner' speech?","June 1963 in West Berlin: told those who don't understand the difference between the free and communist worlds to 'come to Berlin'","k23"],["The Bay of Pigs invasion?","17 April 1961: 1400 CIA-trained Cuban exiles landed in Cuba; the plan leaked, ships were wrecked on reefs, and Castro's forces killed 114 and captured over 1100","k24"],["Impact of the Bay of Pigs?","Humiliated Kennedy and pushed Castro closer to the USSR for protection, leading to the missile deal","k25"],["Why did Khrushchev place missiles in Cuba?","To deter another US invasion of Cuba, to gain a bargaining chip against US Jupiter missiles in Turkey, and to close the missile gap","k26"],["How was the Cuban Missile Crisis discovered?","A U2 photographed missile sites under construction on 16 October 1962; Kennedy set up EXCOMM to plan a response","k27"],["Kennedy's options in the Cuban Missile Crisis, and his choice?","Diplomacy (might look weak), airstrikes or invasion (risked war with the USSR). He chose a naval 'quarantine' around Cuba, announced on TV on 22 October","k28"],["DEFCON 2 in the Cuban Missile Crisis?","US forces ready to deploy within six hours, with nuclear weapons loaded on aircraft: the closest the Cold War came to nuclear war","k29"],["Khrushchev's two letters?","26 October: remove the missiles if the USA promised not to invade Cuba. 27 October: harsher, also demanding the Jupiter missiles leave Turkey","k30"],["Black Saturday, 27 October 1962?","A U2 was shot down by a Soviet-supplied SAM and its pilot killed; EXCOMM urged strikes, but Kennedy refused and answered the first letter","k31"],["How was the Cuban Missile Crisis resolved?","The USSR removed its missiles under UN supervision; the USA publicly pledged not to invade Cuba and secretly removed its missiles from Turkey (April 1963); the quarantine ended on 20 November","k32"],["Consequences of the Cuban Missile Crisis?","The hotline (June 1963) and the Partial Test Ban Treaty (August 1963); Kennedy's prestige rose; Khrushchev was humiliated and deposed in 1964 for Brezhnev","k33"],["McNamara's view of why nuclear war was avoided?","'It was luck': human fallibility combined with nuclear weapons nearly destroyed nations","k34"]],"exam":[{"t":"Explain","m":6,"q":"Explain why relations between the USA and Cuba broke down after the Cuban Revolution.","g":"Cuba's prior reliance on the USA; Castro removing non-communists and suppressing dissent; growing ties with the USSR and tariffs on US goods; exile accounts and domino fears; nationalisation of 600 companies ($1.8 billion) and the US embargo. Show how each action provoked a reaction (the escalation chain)."},{"t":"Describe","m":4,"q":"Describe why tensions over Berlin grew between 1958 and 1961.","g":"West Berlin as a capitalist showcase and escape route (brain drain), and a spy base; the 1958 ultimatum; the U2 incident collapsing the Paris summit; the reissued 1961 ultimatum and refugee surge. Accurate features, no evaluation needed."},{"t":"Explain","m":6,"q":"Explain the impact of the Berlin Wall on Cold War tensions.","g":"Construction (13 August 1961) and the death strip; Western outrage and Kennedy's solidarity measures; the Checkpoint Charlie standoff (27 October 1961) and its resolution; the Wall as a symbol of division and of communist failure, which also stabilised Berlin ('a wall is better than a war'). Link causes to effects."},{"t":"Analyse","m":6,"q":"Analyse the reasons the Cuban Missile Crisis did not result in nuclear war.","g":"Identify the key turning points and how they relate: Kennedy choosing a quarantine over strikes; Soviet ships turning back; ignoring the second letter and accepting the first; Robert Kennedy and Dobrynin's secret Turkey deal; leaders overruling hardliners; luck (McNamara). Show how these combined to de-escalate."},{"t":"Evaluate","m":10,"q":"'The Cuban Missile Crisis was caused by American aggression.' To what extent do you agree?","g":"A judgement. US side: the Bay of Pigs, the embargo, Jupiter missiles in Turkey, domino-driven hostility. Soviet side: the secret missile deployment, Gromyko's denials, Khrushchev's gamble to close the missile gap. Weigh them using evidence and reach a balanced conclusion."}]},{"subject":"History","name":"Vietnam: Escalation","boss":"The Jungle Phantom","art":5,"cards":[["French Indochina?","France's 19th-century colony of Vietnam, Cambodia and Laos (protectorate forced on Vietnam in 1883), exploited for labour on rubber plantations, where death rates reached 47% a year","v1"],["Ho Chi Minh?","Vietnamese nationalist and communist: petitioned Versailles for self-determination, united Vietnamese communist groups (1930), founded the Viet Minh (1941), declared independence on 2 September 1945","v2"],["The Viet Minh?","Ho Chi Minh's independence movement (1941) that resisted the French and the Japanese during WW2","v3"],["Ho's 1945 Declaration of Independence?","2 September 1945, to 400,000 people in Hanoi: modelled on the US Declaration to win American support; independence had been taken from Japan, not France","v4"],["How was Vietnam occupied at the end of WW2?","Split at the 16th parallel: the British in the south helped restore French rule; the Chinese in the north left Ho's government in place until the French returned (March 1946)","v5"],["How did the First Indochina War start?","France rejected Ho's July 1946 compromise of self-government within French Indochina; violence broke out in November 1946","v6"],["Guerrilla warfare?","Tactics that let a weaker force beat a stronger one by avoiding direct battle: ambushes, raids, hit-and-run attacks, concealment and mobility. Used by Giap's Viet Minh and later the VC","v7"],["Dien Bien Phu?","May 1954: the French base fell to the Viet Minh, a humiliating defeat that ended French rule. Eisenhower refused to intervene, even though an atomic bomb was discussed","v8"],["The Geneva Accords?","20 July 1954: Vietnam independent; temporarily divided at the 17th parallel (Viet Minh north, State of Vietnam south) with a DMZ; national elections set for July 1956","v9"],["Flaw of the Geneva Accords?","The USA and South Vietnam only 'acknowledged' them and never signed; Diem and the USA had no intention of holding the 1956 elections that Ho would have won","v10"],["Why did the USSR and China pressure Ho to compromise at Geneva?","Cold War tensions: they wanted to avoid provoking the USA, so Ho postponed total victory","v11"],["How did US aid to the French grow?","From $10 million of military equipment in 1950 to $350 million by 1953, with MAAG set up to observe its use: France's war was seen as containment in Asia","v12"],["Ngo Dinh Diem?","US-backed anti-communist nationalist; Prime Minister of South Vietnam (1954), then President after a rigged referendum against Bao Dai (October 1955)","v13"],["Problems with Diem's rule?","Nepotism, favouring the Catholic minority and discriminating against the Buddhist majority, authoritarianism, corruption, press restrictions, failed land reform","v14"],["Viet Cong (VC)?","Communist guerrillas who infiltrated rural South Vietnam from 1959 and spread their influence among the peasants","v15"],["Strategic Hamlets?","Diem's policy of moving over 4 million peasants (34% of the population) into fortified villages to isolate the VC; it caused resentment and the VC still infiltrated","v16"],["The Buddhist Crisis?","1963: protests against Diem's discrimination spread from Hue and were violently crushed; monk Thich Quang Duc burned himself to death in June 1963","v17"],["Why did JFK authorise the coup against Diem?","Diem's unpopularity and repression were helping the VC, making US goals impossible ('more and more difficult to achieve with Diem in control')","v18"],["The coup against Diem?","1 November 1963: ARVN generals seized the palace; Diem and his brother Nhu were executed on 2 November","v19"],["Consequences of the coup against Diem?","Chaos: 12 governments in South Vietnam between 1963 and 1965, and the VC stepped up attacks","v20"],["LBJ?","Lyndon B. Johnson, president after JFK's assassination (22 November 1963); committed to the Domino Theory and an independent South Vietnam","v21"],["The Gulf of Tonkin Incident?","2 August 1964: North Vietnamese boats attacked the USS Maddox. A second 'attack' on 4 August, in a storm, probably never happened; evidence that it didn't was withheld from LBJ","v22"],["The Gulf of Tonkin Resolution?","August 1964: gave LBJ power to 'take all necessary measures, including the use of armed force', without a declaration of war (416-0 in the House, 88-2 in the Senate)","v23"],["Why was the Tonkin report one-sided?","Hawks like McNamara wanted escalation and unanimous congressional support; LBJ faced an election and didn't want to look 'soft' on communism","v24"],["What triggered escalation in 1965?","VC attacks on Camp Holloway at Pleiku (8 killed) and Qui Nhon (23 killed), February 1965","v25"],["Operation Rolling Thunder?","The sustained US bombing of North Vietnam from March 1965, meant to cripple the war effort, break the will to fight, and stop support for the VC, in about 8 weeks. It failed","v26"],["First US combat troops in Vietnam?","Marines landed at Da Nang on 8 March 1965; 180,000 more troops followed by the end of the year","v27"],["The Ho Chi Minh Trail?","A 19,000km network through Laos and Cambodia supplying the VC: over 2 million troops and up to 20,000 tons of material a month","v28"],["US attempts to cut the Trail?","About 2 million bombs, Agent Orange and napalm defoliation, cloud-seeding, sensors. It failed: the Trail was rerouted and repaired, and civilian deaths pushed people to the communists","v29"],["Viet Cong tactics?","Avoided pitched battles, booby traps (11% of US deaths), snipers, tunnel networks and safe havens in sympathetic villages","v30"],["Search and Destroy?","Westmoreland's strategy of patrols to find and kill VC, backed by air and artillery support and helicopters; success measured by body count","v31"],["Why did Search and Destroy fail?","Poor intelligence killed civilians; 'zippo raids' burned villages; the VC withdrew and returned, so areas had to be cleared again and again; the result was more support for the communists","v32"],["Why did the US believe they were winning in 1967?","Inflated body counts and the belief that bombing was crippling the North; Humphrey said there was 'no military stalemate'","v33"],["The Tet Offensive?","From 30-31 January 1968: 80,000 NVA and VC attacked over 100 towns and cities, including Saigon, during a fake Tet ceasefire","v34"],["Military outcome of Tet?","A disaster for the North: no popular uprising, no base or city held, up to 50,000 of 80,000 killed vs 2600 US and ARVN deaths","v35"],["Why was Tet the turning point of the Vietnam War?","A political and strategic victory for the North: it exposed the government's optimism as false, public support collapsed, Cronkite called it a stalemate, and LBJ didn't run again (31 March 1968)","v36"],["The 'Living Room War'?","About 50 million Americans watched the war on the evening news, e.g. the image of Nguyen Ngoc Loan executing Nguyen Van Lem (February 1968)","v37"],["Why did frustration grow among US troops?","Young draftees (average age 22) faced booby traps and snipers, and couldn't tell friend from enemy ('They all looked alike')","v38"],["The My Lai Massacre?","16 March 1968: Charlie Company, ordered to destroy the village and treat everyone as VC, killed 347-504 unarmed civilians on Lt Calley's orders; only 3 weapons were found","v39"],["Hugh Thompson?","The helicopter pilot who landed between the soldiers and civilians at My Lai, threatened to fire on US troops, and flew survivors to safety","v40"],["Impact of My Lai?","Revealed by Seymour Hersh in November 1969; public horror, the anti-war movement intensified, trust in the army fell. Calley was convicted of 22 murders but served only 3 years of house arrest","v41"]],"exam":[{"t":"Describe","m":4,"q":"Describe how Ho Chi Minh resisted French colonial rule in Vietnam.","g":"Accurate features: nationalist petitions (Versailles), founding the communist party and the Viet Minh, the 1945 Declaration of Independence, failed negotiation (1946), the First Indochina War with Giap's guerrilla tactics, victory at Dien Bien Phu (1954)."},{"t":"Evaluate","m":6,"q":"Evaluate the claim that the Geneva Accords were a sensible solution to a complex situation.","g":"For: ended 75 years of colonialism, ceasefire and DMZ, elections planned. Against: temporary division, the USA and Diem never signed, the 1956 elections were cancelled, superpower pressure on Ho. A judgement supported by evidence."},{"t":"Explain","m":6,"q":"Explain why the USA increased its involvement in South Vietnam between 1954 and 1963.","g":"Domino Theory and containment; aid to France rising to $350 million; backing Diem as an anti-communist; VC insurgency from 1959 (Green Berets as advisers); the Buddhist Crisis and the Diem coup drawing the USA deeper. Link each to deeper involvement."},{"t":"Explain","m":6,"q":"Explain the significance of the Gulf of Tonkin Resolution.","g":"Context: the 2 August attack and the doubtful 4 August 'attack', with evidence withheld. The resolution: 'all necessary measures' without a declaration of war, passed almost unanimously. Significance: a legal blank cheque leading to Rolling Thunder and combat troops (1965), and later a credibility gap."},{"t":"Analyse","m":6,"q":"Analyse the effectiveness of US responses to Viet Cong guerrilla tactics.","g":"Identify the VC tactics (booby traps, tunnels, the Trail, blending in) and each US response (Search and Destroy, bombing the Trail, defoliants, hamlets). Relate them: each response failed and created civilian resentment that strengthened the VC. Draw out the implication: the US could not win hearts and minds."},{"t":"Evaluate","m":10,"q":"'By 1968 it was clear that the US intervention in Vietnam was failing.' To what extent do you agree?","g":"A judgement. Evidence of failure: tactics failing (Search and Destroy, the Trail), Tet exposing false optimism, public support collapsing, LBJ withdrawing, My Lai. Counter: Tet was a military defeat for the North, US forces were still dominant on the battlefield. Weigh military vs political success."}]},{"subject":"History","name":"Vietnam: Withdrawal","boss":"The Silent Majority","art":1,"cards":[["The Civil Rights Movement?","The struggle for Black Americans' equal rights under the law; officially began in 1954, led by many activists and groups rather than one founder","w1"],["14th and 15th Amendments?","14th (1868): equal protection under the law for Black Americans. 15th (1870): Black men given the vote","w2"],["Jim Crow laws?","Southern segregation laws from the late 19th century: segregated facilities, housing and schools, voter literacy tests, a ban on interracial marriage","w3"],["Events that brought national attention to civil rights?","The murder of Emmett Till (1955) and his killers' acquittal; Rosa Parks and the 381-day Montgomery Bus Boycott (1955); the Little Rock Nine (1957), escorted by the US Army","w4"],["Martin Luther King Jr's method?","Non-violent direct action: peaceful civil disobedience against segregation, even when met with violence","w5"],["Key civil rights protests of the early 1960s?","Greensboro sit-ins (1960, spreading to 55 cities); the SCLC Birmingham campaign; March on Washington (August 1963, 250,000, 'I Have a Dream'); Selma's 'Bloody Sunday' (1965)","w6"],["The landmark civil rights laws?","Civil Rights Act 1964 (ended Jim Crow segregation, banned employment discrimination); Voting Rights Act 1965 (banned literacy tests, federal supervision); Civil Rights Act 1968 (including the Fair Housing Act)","w7"],["The Cold War contradiction of civil rights?","The USA championed freedom abroad while oppressing Black and Native Americans at home; the USSR championed workers while repressing its own citizens","w8"],["'Peace with honour'?","Nixon's goal: withdraw from Vietnam without appearing defeated or abandoning South Vietnam","w9"],["Vietnamisation?","Nixon's policy (January 1969): phased withdrawal of US troops while training and equipping the ARVN to defend South Vietnam itself","w10"],["Operation Menu?","From March 1969: Nixon's secret bombing of VC and NVA sanctuaries in neutral Cambodia. It widened the war and devastated Cambodian villages","w11"],["The Phoenix Program?","A CIA program to identify VC operatives for arrest or assassination: up to 40,000 killed, with torture, and many innocent civilians among the victims","w12"],["The 'silent majority'?","Nixon's November 1969 appeal to Americans who didn't protest publicly, asking for their support for his approach to ending the war","w13"],["The Cambodian incursion?","30 April 1970: US and ARVN troops invaded Cambodia after Lon Nol's coup to destroy NVA bases, but found mostly empty huts","w14"],["Consequences of the Cambodian incursion?","NVA bases moved into South Vietnam; the USA had to prop up Lon Nol; mass protests (Kent State); international condemnation; Congress banned US troops outside Vietnam (January 1971); the Khmer Rouge rose","w15"],["Operation Lam Son 719?","February 1971 ARVN invasion of Laos with US air support; abandoned after 6 weeks with about 50% ARVN casualties. Vietnamisation was clearly failing","w16"],["Origins of the anti-war movement?","Began after Tonkin on college campuses: SDS 'teach-ins' from March 1965 (University of Michigan), students, intellectuals and the counterculture","w17"],["Draft resistance?","570,000 draft offenders, 25,000 draft cards burned, 30,000 fled to Canada. Muhammad Ali refused to serve (1966), was stripped of his title and banned for 3 years; his conviction was overturned in 1971","w18"],["Why did the anti-war movement grow in 1967?","15,058 US deaths, 40,000 drafted a month, $25 billion a year; the October march on the Pentagon (100,000); MLK joined, calling the war 'a blasphemy against all that America stands for'","w19"],["The Moratorium?","October 1969: over 500,000 Americans protested in 1200 cities, the first time the anti-war movement became a 'fully-fledged mass movement'","w20"],["Kent State?","4 May 1970: the National Guard shot four students dead at a protest against the Cambodian incursion, fuelling more protests","w21"],["Vietnam Veterans Against the War?","Veterans, many wounded, who protested and threw away their medals (over 700 at the Capitol in April 1971), winning people to the anti-war cause","w22"],["Impacts of the anti-war movement?","LBJ began peace talks (1968); Nixon campaigned on withdrawal; the draft ended in early 1973","w23"],["Nixon's 1972 diplomacy?","Visits to China (February) and the USSR (May), part of the thaw in the Cold War and a way to isolate North Vietnam","w24"],["The 1972 Easter Offensive?","March-June 1972 NVA attack to strengthen North Vietnam's bargaining position; it overran 100 outposts and showed the ARVN couldn't win without US air support","w25"],["The October 1972 breakthrough?","The USA dropped its demand that the NVA leave the South; the North dropped its demand that Thieu be removed; a council would supervise elections","w26"],["Why did the October 1972 deal stall?","Thieu rejected it and demanded 69 amendments, despite $2 billion in extra US equipment, so the North saw the USA as insincere","w27"],["Operation Linebacker II?","December 1972: 11 days of the war's heaviest bombing (20,000 tonnes on Hanoi, over 1600 killed) that forced the North back to talks","w28"],["The Paris Peace Accords?","Signed 23 January 1973 by Kissinger and Le Duc Tho, almost identical to the October deal; the last US combat troops left on 29 March 1973","w29"],["Cost of the Vietnam War to the USA?","58,220 Americans killed, about 150,000 injured, $176 billion; up to 3.5 million died across Vietnam, Cambodia and Laos (1954-75)","w30"],["The fall of Saigon?","30 April 1975, after the final NVA offensive (March 1975) supplied by the USSR and China and a paved Ho Chi Minh Trail; Vietnam unified as the Socialist Republic of Vietnam on 2 July 1976","w31"],["Khmer Rouge?","Cambodian communist guerrillas who took power in 1975 and killed about 2 million Cambodians in four years","w32"]],"exam":[{"t":"Outline","m":4,"q":"Outline the development of the Civil Rights Movement in the USA and its outcomes.","g":"Main features: origins (Jim Crow despite the 14th and 15th Amendments); key events (Till, Parks and Montgomery, Little Rock, sit-ins, the March on Washington, Selma); MLK's non-violence; outcomes (Civil Rights Acts 1964 and 1968, Voting Rights Act 1965)."},{"t":"Explain","m":6,"q":"Explain why Nixon was not prepared to immediately withdraw from Vietnam.","g":"'Peace with honour': fear of the first US defeat and a collapse of confidence in US leadership (Silent Majority speech); the Domino Theory; not wanting to abandon the South; bargaining position with the North. Link to his policies: Vietnamisation, bombing, incursions."},{"t":"Evaluate","m":6,"q":"Evaluate the claim that Nixon de-escalated US involvement in the Vietnam War.","g":"De-escalation: Vietnamisation, troops cut (280,000 by end of 1970, 70,000 by mid-1972), talks, the draft ended. Escalation: secret bombing of Cambodia, the Cambodian and Laos incursions, Phoenix, Linebacker II. A judgement on the overall balance."},{"t":"Explain","m":6,"q":"Explain how the anti-war movement developed in the USA.","g":"Origins (teach-ins, SDS 1965); growth (draft resistance, 1967 costs and casualties, MLK, protest songs); peak (Tet, My Lai, the Moratorium, Kent State, VVAW, April 1971); impacts on government. Show causes of each stage of growth."},{"t":"Analyse","m":6,"q":"Analyse the reasons the USA was able to leave Vietnam in 1973.","g":"Relate the factors: Vietnamisation's troop reductions; superpower diplomacy (China and USSR visits) reducing Northern support; the October compromise; Linebacker II forcing the North back to talks; domestic pressure. Show how military pressure and diplomacy combined to produce the Paris Accords."},{"t":"Evaluate","m":10,"q":"'The Vietnam War was a disaster for the USA from its bad beginning until its tragic end.' To what extent do you agree?","g":"A judgement. Beginning: Geneva ignored, Diem, Tonkin deception. Conduct: tactics failing, My Lai, Tet. End: Vietnamisation failing, the fall of Saigon (1975), 58,220 dead, $176 billion, domestic division. Possible counterpoints: Paris Accords, the détente gains of 1972. Weigh and conclude."}]},{"subject":"History","name":"Détente","boss":"The Thawing Glacier","art":6,"cards":[["Problems facing the USA in the 1970s?","Political division over Vietnam, economic downturn (inflation, job losses), continuing civil rights struggles, and a crisis of confidence in American leadership after losing Vietnam","d1"],["Watergate?","17 June 1972: burglars linked to Nixon's re-election committee bugged the Democratic National Committee; Nixon covered it up with hush money and tried to use the CIA to block the FBI","d2"],["How was Watergate exposed?","Washington Post reporters Woodward and Bernstein, tipped off by 'Deep Throat'; Nixon's own tapes proved his role after the Supreme Court ordered their release (July 1974)","d3"],["How did Watergate end?","Congress moved to impeach Nixon for obstruction of justice and abuse of power; he resigned in August 1974 and was pardoned by Gerald Ford","d4"],["Stagflation?","High inflation combined with slow growth and unemployment, triggered by the 1973 Arab oil embargo and the deficit from Vietnam and social spending; 2.3 million jobs lost 1973-75","d5"],["Triumphalism?","The 1950s-60s American belief that its system was superior and would triumph; trust in government reached 80%","d6"],["Vietnam Syndrome?","1970s disillusionment that led Americans to reject intervening in foreign conflicts, feeding support for détente","d7"],["Why was Khrushchev removed?","His Cuban backdown was seen as humiliating, his leadership was erratic, and his reforms (Virgin Lands) failed. The Politburo removed him on 14 October 1964","d8"],["Brezhnev's two eras?","Stabilisation (1964-73) and stagnation (1973-82); he ruled 18 years, second only to Stalin","d9"],["Brezhnev's domestic policy?","Reversed Khrushchev's reforms: power centralised in Moscow, tighter censorship, expanded KGB, over 10,000 political prisoners by the mid-1970s, but no Stalinist purges","d10"],["Why did the Soviet economy stagnate?","Military spending to exceed US stockpiles, consumer shortages, decaying infrastructure, an economy too complex to plan, a bloated bureaucracy, and no incentives for workers","d11"],["The Prague Spring?","1968: Dubcek's 'socialism with a human face' reduced censorship in Czechoslovakia; it was crushed in August 1968 by 200,000 Warsaw Pact troops and 5000 tanks","d12"],["The Brezhnev Doctrine?","A threat to any socialist country is a threat to all; the USSR would intervene militarily to stop a satellite abandoning communism, 'even if it meant a 3rd World War'","d13"],["Détente?","French for 'easing of tension'; the 1969-79 period of managed, more cooperative superpower relations, from Nixon's presidency to the Soviet invasion of Afghanistan","d14"],["Limits of détente?","It managed conflict rather than ending it: proxy wars continued in Asia and Africa, and both sides still attacked each other's systems","d15"],["Cause of détente: the costs of conflict?","The Cuban Missile Crisis showed the nuclear danger (the US arsenal peaked at over 30,000 weapons in 1968); military spending was hurting infrastructure and living standards in both countries","d16"],["Cause of détente: changes in leadership?","Nixon and Kissinger were pragmatic, not ideological, and used 'linkage' (concessions traded for equal concessions); Brezhnev also saw the Cold War as geopolitics and would deal if treated as an equal","d17"],["Linkage?","Nixon and Kissinger's policy of tying concessions in one area to equal concessions by the other side elsewhere","d18"],["Cause of détente: the Sino-Soviet split?","China and the USSR fell out over ideology (Mao rejected de-Stalinisation) and borders (1969 clashes); Nixon's visit to China (1972) pressured the USSR to deal with the USA","d19"],["The Nuclear Non-Proliferation Treaty (NPT)?","1968: the USSR, USA and Britain agreed not to transfer nuclear weapons technology or help other states build them; most of the UN later joined","d20"],["The Anti-Ballistic Missile (ABM) Treaty?","1972: each side limited to two anti-missile sites of at most 100 interceptors, because missile defence would undermine MAD","d21"],["SALT I?","1972, Nixon and Brezhnev: froze the building of new nuclear weapons except to replace old ones, for 5 years","d22"],["SALT II?","Signed by Carter and Brezhnev in June 1979 to cap weapons, but never ratified by Congress after the invasion of Afghanistan","d23"],["The Helsinki Accords?","1975, 35 nations: recognised Europe's post-war borders (accepting Soviet dominance of the East), committed to non-interference and to respect for human rights","d24"],["Impact of Helsinki's human rights clauses?","Helsinki Monitoring Groups exposed abuses behind the Iron Curtain (the Moscow group smuggled out 195 reports); Helsinki Watch (1978) later became Human Rights Watch","d25"],["Apollo-Soyuz?","The first joint US-Soviet space mission (1975), using a universal docking system; it paved the way for the ISS (1998)","d26"],["Significance of détente?","Showed the superpowers could cooperate: summits, treaties, cultural exchanges (50,000 Soviet visitors), mutual trust, and cautious optimism about a peaceful end","d27"],["Why détente didn't address the root causes of the Cold War?","New technology bypassed the treaties (more destructive weapons); human rights disputes continued (the 1974 Jackson-Vanik Act); proxy wars in Angola, Mozambique, Ethiopia and Cambodia","d28"],["The Saur Revolution?","1978: the communist PDPA seized power in Afghanistan; repression (up to 18,000 executions) and unpopular reforms sparked rural revolt","d29"],["Why did the USSR invade Afghanistan?","Instability could spread to the Soviet Central Asian republics, fear that the USA would exploit Amin's weak regime, and the Brezhnev Doctrine's obligation to protect socialist regimes","d30"],["The Soviet invasion of Afghanistan?","24 December 1979: about 50,000 troops invaded using the 1978 friendship treaty as a pretext; Amin was replaced by the puppet Babrak Karmal","d31"],["The Mujahideen?","Afghan Islamic resistance fighters who used mountain guerrilla warfare against the Soviets, supported by the USA (Stinger missiles from 1987), Pakistan, Saudi Arabia and China","d32"],["Impacts of the Afghan war?","A 9-year stalemate (withdrawal in February 1989); up to 2 million Afghans dead, 5.5 million refugees, over 14,000 Soviet soldiers killed; UN condemnation (104-18); 67 nations boycotted the 1980 Moscow Olympics","d33"],["How did Afghanistan end détente?","Carter withdrew the US ambassador and halted SALT II, Reagan won in 1980 on a confrontational platform, and the arms race resumed: the 'Second Cold War'","d34"]],"exam":[{"t":"Explain","m":6,"q":"What was the most significant cause of détente? Justify your answer us
